<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>照護學堂 · 管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

</head>
<body>
<div id="root"><div class="shell wide"><div class="content"><div class="note center" style="padding:60px">載入中…</div></div></div></div>
<div id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=14"></script>
<script src="db.js?v=14"></script>
<script>
/* =====================================================================
   後台 admin.html —— 題庫管理（測驗 / 題目 / 帳號 / AI）
   僅限管理員（role=admin）。非管理員一律導回前台登入。
   ===================================================================== */

const Sa = { tab:'quizzes', editQuiz:null, k:null, profiles:[], material:'', impN:'auto', drafts:[], draftQuiz:null, newQuizOpen:false, merges:[], editMerge:null, mergeSel:[],
  // 新增測驗表單（支援台籍/外籍）
  nqTitle:'', nqDesc:'', nqAudience:'local', nqLang:'vi', nqKind:'skill',
  // AI 匯入產生的草稿批次語言（zh=一般；vi/id=外語）＋類別
  draftLang:'zh', draftKind:'skill',
  // 學中文單字卡管理
  vocabLang:'vi', vzh:'', vocabEditingList:[], vocabBoth:false, vocabBusy:false, vocabMaterial:'', vocabN:'auto', vocabDrafts:[], vocabBatch:null,
  // 帳號管理：清單篩選 + 批次建立
  uFilterUnit:'all', uFilterRole:'all', batch:null };
function resetK(){ Sa.k={ qid:null, stem:'', answers:['','','',''], correctIdx:0, explain:'', quizNote:'', flashAnswer:'' }; }
resetK();
const root=()=>document.getElementById('root');

/* ---------- 啟動：驗證管理員身分 ---------- */
async function boot(){
  const s=await Auth.session();
  if(!s){ location.href='index.html'; return; }
  await Auth.loadProfile();
  if(!Auth.isAdmin()){
    root().innerHTML=`<div class="shell wide"><div class="content"><div class="card center" style="padding:50px 22px">
      <div class="big-emoji">🔒</div><h3 style="margin:12px 0">此頁僅限管理員</h3>
      <div class="note center">你的帳號沒有管理員權限。</div>
      <a class="btn" style="margin-top:18px" href="index.html">↩ 回前台</a>
    </div></div></div>`;
    return;
  }
  try{ await DB.loadForAdmin(); Sa.profiles=await DB.allProfiles(); Sa.merges=await DB.loadUnitMerges(); await DB.loadVocab(); }catch(e){ toast('載入失敗：'+e.message); }
  render();
}

const TABS=[
  {k:'quizzes',  e:'📋', n:'測驗管理'},
  {k:'questions',e:'📝', n:'題目'},
  {k:'import',   e:'📄', n:'AI 匯入出題'},
  {k:'vocab',    e:'🈶', n:'學中文'},
  {k:'users',    e:'👤', n:'帳號'},
  {k:'units',    e:'🏢', n:'單位'},
  {k:'settings', e:'⚙️', n:'AI 設定'},
];
function render(){
  const body={ quizzes:viewQuizzes, questions:viewQuestions, import:viewImport, vocab:viewVocab, users:viewUsers, units:viewUnits, settings:viewSettings }[Sa.tab]();
  root().innerHTML=`<div class="shell wide">
    <div class="topbar">
      <div class="brand"><span class="mark">✚</span>照護<b>學堂</b> · 管理後台</div>
      <div class="grow"></div>
      <a href="report.html" class="toplink" style="margin-right:8px">📊 主管報表</a>
      <a href="index.html" class="toplink" style="margin-right:8px">↩ 前台</a>
      <button class="iconbtn" title="登出" onclick="Auth.logout().then(()=>location.href='index.html')">⏻</button>
    </div>
    <div class="tabnav">
      ${TABS.map(t=>`<button class="${Sa.tab===t.k?'on':''}" onclick="goTab('${t.k}')">${t.e} ${t.n}</button>`).join('')}
    </div>
    <div class="content" style="padding-bottom:40px">${body}</div>
  </div>`;
  bindChips();
}
function goTab(k){ Sa.tab=k; if(k==='units'){ Sa.editMerge=null; Sa.mergeSel=[]; } window.scrollTo(0,0); render(); }
function bindChips(){
  document.querySelectorAll('#nq_roles input, #niq_roles input').forEach(cb=>{
    cb.onchange=()=>cb.closest('.chip-ck').classList.toggle('sel', cb.checked); });
  document.querySelectorAll('#nu_role input').forEach(rb=>{
    rb.onchange=()=>{ document.querySelectorAll('#nu_role .chip-ck').forEach(x=>x.classList.remove('sel')); rb.closest('.chip-ck').classList.add('sel'); if(typeof syncNuForeign==='function') syncNuForeign(); }; });
}
/* 帳號表單：T 開頭自動勾外籍；外籍才顯示語言選單 */
function syncNuForeign(){
  const idEl=document.getElementById('nu_id'); if(!idEl) return;
  const id=(idEl.value||'').trim().toUpperCase();
  const fr=document.querySelector('#nu_role input[value="foreign_care"]');
  if(id.charAt(0)==='T' && fr && !fr.checked){
    fr.checked=true;
    document.querySelectorAll('#nu_role .chip-ck').forEach(x=>x.classList.remove('sel'));
    fr.closest('.chip-ck').classList.add('sel');
  }
  const wrap=document.getElementById('nu_lang_wrap');
  if(wrap) wrap.style.display = (fr && fr.checked) ? '' : 'none';
}
/* 用獨立、不持久化的 client 驗證「另一位管理員」帳密，不影響目前登入 */
async function verifyAdminCredentials(empId, password){
  let tmp;
  try{
    tmp=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:'verify_'+Date.now() } });
    const { data, error }=await tmp.auth.signInWithPassword({ email:empIdToEmail(empId), password });
    if(error) return { ok:false, msg:'帳號或密碼錯誤' };
    const uid=data.user && data.user.id;
    const { data:prof }=await tmp.from('profiles').select('role,name').eq('id',uid).single();
    const ok=!!prof && prof.role==='admin';
    return { ok, msg: ok?'':'此帳號不是管理員，無法授權', name: prof && prof.name };
  }catch(e){ return { ok:false, msg:(e&&e.message)||'驗證失敗' }; }
  finally{ if(tmp){ try{ await tmp.auth.signOut(); }catch(_){} } }
}

/* 測驗標籤：外籍顯示語言+類別；台籍顯示開放角色 */
function quizTags(q){
  if(q && q.audience==='foreign'){
    return `<span class="tag amber">🌏 ${langOf(q.lang).flag} ${langName(q.lang)}</span><span class="tag">${kindOf(q.kind).emoji} ${kindOf(q.kind).name}</span>`;
  }
  return (q.roles||[]).map(r=>`<span class="tag teal">${roleName(r)}</span>`).join('');
}

/* =====================================================================
   測驗管理
   ===================================================================== */
function viewQuizzes(){
  return `
  <div class="admin-hint">💡 測驗是題目的分類，並決定「開放給哪些角色」。護理專屬測驗，照服員在前台不會看到。</div>
  <div class="cols2">
    <div class="card">
      <div class="card-h">➕ 新增測驗</div>
      <label class="fld">對象</label>
      <div class="chips">
        <div class="chip-ck ${Sa.nqAudience==='local'?'sel':''}" onclick="setNqAudience('local')">🏠 台籍／一般</div>
        <div class="chip-ck ${Sa.nqAudience==='foreign'?'sel':''}" onclick="setNqAudience('foreign')">🌏 外籍</div>
      </div>
      <label class="fld">測驗名稱</label>
      <input id="nq_title" value="${esc(Sa.nqTitle)}" oninput="Sa.nqTitle=this.value" placeholder="例如：跌倒預防">
      <label class="fld">說明</label>
      <input id="nq_desc" value="${esc(Sa.nqDesc)}" oninput="Sa.nqDesc=this.value" placeholder="例如：全體員工共同必考">
      ${Sa.nqAudience==='local' ? `
        <label class="fld">開放對象（可複選）</label>
        <div class="chips" id="nq_roles">
          ${ROLES.filter(r=>r.key!=='admin' && !r.foreign).map(r=>`<label class="chip-ck" data-role="${r.key}"><input type="checkbox" value="${r.key}">${r.emoji} ${r.name}</label>`).join('')}
        </div>` : `
        <label class="fld">語言</label>
        <div class="chips">
          ${LANGS.map(l=>`<div class="chip-ck ${Sa.nqLang===l.key?'sel':''}" onclick="Sa.nqLang='${l.key}';render()">${l.flag} ${l.name}</div>`).join('')}
        </div>
        <label class="fld">類別</label>
        <div class="chips">
          ${KINDS.map(k=>`<div class="chip-ck ${Sa.nqKind===k.key?'sel':''}" onclick="Sa.nqKind='${k.key}';render()">${k.emoji} ${k.name}</div>`).join('')}
        </div>
        <div class="note" style="color:var(--accent-dk)">🔒 外籍測驗自動鎖定為「外籍照服」專屬，不可混台籍。</div>` }
      <button class="btn block" style="margin-top:16px" onclick="createQuiz()">建立測驗</button>
    </div>
    <div class="card">
      <div class="card-h">現有測驗（${DB.quizzes().length}）</div>
      ${DB.quizzes().map(q=>{ const n=DB.questionsOf(q.id).length;
        return `<div class="row-item">
          <div class="thumb">${q.emoji||'📘'}</div>
          <div class="row-body"><div class="t">${esc(q.title)}</div>
            <div class="s">${esc(q.descr||'')} · ${n} 題</div>
            <div class="tags">${quizTags(q)}</div></div>
          <button class="btn danger sm" onclick="removeQuiz('${q.id}')">刪除</button>
        </div>`; }).join('') || '<div class="empty">尚無測驗</div>'}
    </div>
  </div>`;
}
function setNqAudience(a){ Sa.nqAudience=a; render(); }
async function createQuiz(){
  const title=(Sa.nqTitle||'').trim();
  if(!title){ toast('請輸入測驗名稱'); return; }
  const descr=(Sa.nqDesc||'').trim();
  try{
    if(Sa.nqAudience==='foreign'){
      await DB.addQuiz({ title, descr, emoji:kindOf(Sa.nqKind).emoji, roles:['foreign_care'], audience:'foreign', lang:Sa.nqLang, kind:Sa.nqKind });
    } else {
      const roles=[...document.querySelectorAll('#nq_roles input:checked')].map(c=>c.value);
      if(!roles.length){ toast('請至少選一個開放對象'); return; }
      await DB.addQuiz({ title, descr, emoji:'📘', roles, audience:'local', lang:'zh', kind:'skill' });
    }
    Sa.nqTitle=''; Sa.nqDesc=''; toast('測驗已建立'); render();
  }
  catch(e){ toast('建立失敗：'+e.message); }
}
async function removeQuiz(id){
  const n=DB.questionsOf(id).length;
  if(!confirm(`確定刪除此測驗？${n?`（含 ${n} 題會一併刪除）`:''}`)) return;
  try{ await DB.delQuiz(id); toast('已刪除'); render(); }catch(e){ toast('刪除失敗：'+e.message); }
}

/* =====================================================================
   題目 —— 先選測驗，再用 Kahoot 式介面出題
   ===================================================================== */
const KT=[
  { cls:'kt-red',    shape:'▲' },
  { cls:'kt-blue',   shape:'◆' },
  { cls:'kt-yellow', shape:'●' },
  { cls:'kt-green',  shape:'■' },
];
function viewQuestions(){
  if(!DB.quizzes().length) return `<div class="admin-hint">請先到「測驗管理」建立至少一個測驗，才能出題。</div>`;
  if(Sa.editQuiz && !DB.quiz(Sa.editQuiz)) Sa.editQuiz=null;
  return Sa.editQuiz ? viewQuizEditor() : viewQuizPicker();
}
function viewQuizPicker(){
  return `
  <div class="admin-hint">💡 先選擇一份測驗，再進去新增題目。點「出題」進入 Kahoot 式編輯畫面。</div>
  <div class="card">
    <div class="card-h">📋 選擇要出題的測驗</div>
    ${DB.quizzes().map(q=>{ const n=DB.questionsOf(q.id).length;
      return `<div class="row-item">
        <div class="thumb">${q.emoji||'📘'}</div>
        <div class="row-body"><div class="t">${esc(q.title)}</div>
          <div class="s">${esc(q.descr||'')} · ${n} 題</div>
          <div class="tags">${quizTags(q)}</div></div>
        <button class="btn sm" onclick="openQuizEditor('${q.id}')">出題 →</button>
      </div>`; }).join('')}
  </div>`;
}
function openQuizEditor(id){ Sa.editQuiz=id; resetK(); window.scrollTo(0,0); render(); }
function backToPicker(){ Sa.editQuiz=null; resetK(); render(); }

function viewQuizEditor(){
  const quiz=DB.quiz(Sa.editQuiz), list=DB.questionsOf(quiz.id), editing=!!Sa.k.qid;
  return `
  <div class="crumb">
    <button class="back" onclick="backToPicker()">← 所有測驗</button>
    <span class="cur">${quiz.emoji||'📘'} ${esc(quiz.title)}</span>
    <span class="tags">${quizTags(quiz)}</span>
  </div>

  <div class="card">
    <div class="card-h">${editing?'✏️ 編輯題目':'➕ 新增題目'}</div>
    <textarea class="k-stem" placeholder="在這裡輸入題目…" oninput="Sa.k.stem=this.value">${esc(Sa.k.stem)}</textarea>
    <div class="ktiles">
      ${KT.map((t,i)=>`<div class="ktile ${t.cls} ${Sa.k.correctIdx===i?'correct':''}">
        <span class="shape">${t.shape}</span>
        <input placeholder="輸入答案 ${i+1}" value="${esc(Sa.k.answers[i]||'')}" oninput="Sa.k.answers[${i}]=this.value">
        <button class="mark" title="設為正確答案" onclick="setCorrect(${i})">${Sa.k.correctIdx===i?'✓':''}</button>
      </div>`).join('')}
    </div>
    <div class="k-correcthint">點右側 ⭘ 圈選哪一個是<b>正確答案</b>（目前：答案 ${Sa.k.correctIdx+1}）。作答時選項順序會自動隨機。</div>
    <button class="btn amber block" style="margin-top:10px" onclick="genKahootAI()">🤖 AI 依正解生成其餘 3 個錯誤答案</button>

    <label class="fld">📇 字卡完整答案／課本標題（需可獨立閱讀 · 含主題，例：成人 CPR 胸外按壓深度應至少 5 公分）</label>
    <textarea placeholder="用一句可獨立閱讀的完整敘述，含主題，例如：成人 CPR 胸外按壓深度應至少 5 公分、不超過 6 公分" oninput="Sa.k.flashAnswer=this.value">${esc(Sa.k.flashAnswer)}</textarea>
    <button class="btn sec block" style="margin-top:8px" onclick="genFlashKahoot()">🤖 AI 生成字卡完整答案（依正解）</button>

    <label class="fld">📇 字卡詳細解說（先學用 · 越完整越好）</label>
    <textarea placeholder="完整說明正確答案的觀念、原理、易混淆重點…（字卡區會顯示這段）" oninput="Sa.k.explain=this.value">${esc(Sa.k.explain)}</textarea>
    <button class="btn sec block" style="margin-top:8px" onclick="genExplainKahoot()">🤖 AI 生成字卡詳細解說（依本題內容）</button>

    <label class="fld">📝 測驗簡短提示（答完題後顯示的一句話 · 可留空）</label>
    <input placeholder="例如：洗手五時機要記牢" value="${esc(Sa.k.quizNote)}" oninput="Sa.k.quizNote=this.value">

    <div class="inline" style="margin-top:12px">
      ${editing?`<button class="btn ghost" style="flex:1" onclick="cancelEdit()">取消編輯</button>`:''}
      <button class="btn" style="flex:2" onclick="saveKahoot()">${editing?'更新題目':'加入此測驗'}</button>
    </div>
  </div>

  <div class="sect">此測驗的題目（${list.length}）</div>
  ${list.length? list.map(q=>{
    const opts=[q.correct, ...(q.distractors||[])];
    return `<div class="qcard">
      <div class="qh"><p class="stem">${esc(q.stem)}</p>
        <div class="rowbtns">
          <button class="btn sec sm" onclick="editQuestion('${q.id}')">編輯</button>
          <button class="btn danger sm" onclick="delQ('${q.id}')">刪除</button>
        </div></div>
      <div class="qopts">${opts.map((o,i)=>`<span class="qo ${i===0?'ok':''}">${i===0?'✓ ':''}${esc(o)}</span>`).join('')}</div>
      ${q.quiz_note?`<div class="note" style="margin:6px 0 0">📝 ${esc(q.quiz_note)}</div>`:''}
    </div>`; }).join('') : '<div class="empty">此測驗還沒有題目，用上方表單新增第一題吧！</div>'}
  `;
}
function setCorrect(i){ Sa.k.correctIdx=i; render(); }
function editQuestion(id){
  const q=DB.question(id); if(!q) return;
  Sa.k={ qid:q.id, stem:q.stem, answers:[q.correct, ...(q.distractors||[])].slice(0,4), correctIdx:0, explain:q.explain||'', quizNote:q.quiz_note||'', flashAnswer:q.flash_answer||'' };
  window.scrollTo(0,0); render();
}
function cancelEdit(){ resetK(); render(); }
async function saveKahoot(){
  const stem=(Sa.k.stem||'').trim(), ci=Sa.k.correctIdx;
  const correct=(Sa.k.answers[ci]||'').trim();
  const distractors=Sa.k.answers.filter((_,i)=>i!==ci).map(x=>(x||'').trim());
  if(!stem){ toast('請輸入題目'); return; }
  if(!correct){ toast(`請填寫「答案 ${ci+1}」（目前圈選的正解格是空的）`); return; }
  if(distractors.some(x=>!x)){ toast('4 個答案格都要填寫'); return; }
  const qLang=(DB.quiz(Sa.editQuiz)||{}).lang||'zh';
  const payload={ stem, correct, distractors, explain:(Sa.k.explain||'').trim(), quiz_note:(Sa.k.quizNote||'').trim(), flash_answer:(Sa.k.flashAnswer||'').trim(), lang:qLang };
  try{
    if(Sa.k.qid){ await DB.updateQuestion(Sa.k.qid, payload); toast('題目已更新'); }
    else { await DB.addQuestion({ quiz_id:Sa.editQuiz, ...payload }); toast('題目已加入'); }
    resetK(); render();
  }catch(e){ toast('儲存失敗：'+e.message); }
}
async function delQ(id){ if(!confirm('確定刪除此題？'))return; try{ await DB.delQuestion(id); toast('已刪除'); render(); }catch(e){ toast('刪除失敗：'+e.message); } }

/* =====================================================================
   帳號（目前唯讀清單；新增/刪除帳號將由 admin-create-user Edge Function 提供）
   ===================================================================== */
function viewUsers(){
  const list=Sa.profiles||[];
  const fUnit=Sa.uFilterUnit||'all', fRole=Sa.uFilterRole||'all';
  const shown=list.filter(x=> (fRole==='all'||x.role===fRole)
    && (fUnit==='all' || (fUnit==='none' ? !x.unit : x.unit===fUnit)) );
  return `${batchModalHTML()}
  <div class="admin-hint">💡 在這裡建立員工帳號。員工用<b>員工編號（H台籍／T外籍 + 4碼）+ 密碼</b>登入；預設密碼由你設定，員工<b>首次登入會被要求改成自己的密碼</b>。忘記密碼時由你在此重設。</div>
  <div class="cols2">
    <div class="card">
      <div class="card-h">👤 新增帳號</div>
      <label class="fld">員工編號（H＝台籍、<b>T＝外籍</b>，例：H0002 / T0002）</label>
      <input id="nu_id" placeholder="H0002 或 T0002" maxlength="5" oninput="this.value=this.value.toUpperCase();syncNuForeign()">
      <label class="fld">姓名</label>
      <input id="nu_name" placeholder="輸入員工姓名">
      <label class="fld">角色</label>
      <div class="chips" id="nu_role">
        ${ROLES.map(r=>`<label class="chip-ck" data-role="${r.key}"><input type="radio" name="nurole" value="${r.key}">${r.emoji} ${r.name}</label>`).join('')}
      </div>
      <div id="nu_lang_wrap" style="display:none">
        <label class="fld">語言（外籍照服）</label>
        <select id="nu_lang">${LANGS.map(l=>`<option value="${l.key}">${l.flag} ${l.name}</option>`).join('')}</select>
      </div>
      <label class="fld">所屬單位（管理員可留空）</label>
      <select id="nu_unit"><option value="">— 選擇單位 —</option>${['C','D','E'].map(z=>`<optgroup label="區 ${z}">${UNITS.filter(u=>u.zone===z).map(u=>`<option value="${u.code}">${esc(u.name)}（${u.code}）</option>`).join('')}</optgroup>`).join('')}</select>
      <label class="fld">預設密碼（至少 6 碼）</label>
      <input id="nu_pw" placeholder="例如 care1234">
      <button class="btn block" style="margin-top:16px" id="nu_btn" onclick="createStaff()">建立帳號</button>
      <button class="btn sec block" style="margin-top:10px" onclick="openBatch()">📋 批次建立多個帳號</button>
    </div>
    <div class="card">
      <div class="card-h">所有帳號（${shown.length}${shown.length!==list.length?`/${list.length}`:''}）</div>
      <div class="inline" style="gap:8px;margin:0 0 12px;flex-wrap:wrap">
        <select onchange="Sa.uFilterRole=this.value;render()" style="flex:1;min-width:130px;font-size:13px">
          <option value="all" ${fRole==='all'?'selected':''}>職務：全部</option>

async function createStaff(){

  const role=(document.querySelector('#nu_role input:checked')||{}).value;

function _batchUnitCode(v){ v=(v||'').trim(); if(!v) return '';
  const byCode=UNITS.find(u=>u.code.toUpperCase()===v.toUpperCase()); if(byCode) return byCode.code;
  const byName=UNITS.find(u=>u.name===v || `${u.name}（${u.code}）`===v); if(byName) return byName.code;
  const inc=UNITS.find(u=>v.toUpperCase().includes(u.code.toUpperCase())); return inc?inc.code:''; }
function _batchLang(v){ v=(v||'').trim().toLowerCase(); if(/印尼|indo|^id$/.test(v)) return 'id'; if(/越南|viet|^vi$/.test(v)) return 'vi'; return 'vi'; }
async function batchImportFile(input){
  const f=input.files&&input.files[0]; if(!f){ return; }
  try{
    const rows=await parseTabularRows(f);
    if(!rows.length){ toast('檔案沒有資料'); input.value=''; return; }
    let start=0; const first=(rows[0][0]||'').trim().toUpperCase();
    if(!/^[HT]\d{4}$/.test(first)) start=1;  // 第一列不是編號 → 當標題略過
    const imported=[];
    for(let i=start;i<rows.length;i++){
      const c=rows[i]||[]; const id=(c[0]||'').trim().toUpperCase(); if(!id) continue;
      imported.push({ id, unit:_batchUnitCode(c[1]), lang:_batchLang(c[2]) });
    }
    if(!imported.length){ toast('沒有讀到有效的員工編號（第一欄需為 H/T+4碼）'); input.value=''; return; }
    const kept=Sa.batch.rows.filter(r=>(r.id||'').trim());
    Sa.batch.rows=kept.concat(imported); Sa.batch.rows.push({id:'',unit:'',lang:'vi'});
    input.value=''; render();
    toast(`已匯入 ${imported.length} 筆，請核對後按建立`);
  }catch(e){ input.value=''; toast('匯入失敗：'+(e.message||e)); }
}
function batchTemplate(){
  const data=[['員工編號','單位(代碼或名稱,可留空)','語言(越南/印尼,外籍才需要)'],
    ['T0001','C1','越南'],['T0002','C2','印尼'],['H0001','C1','']];
  const csv='﻿'+data.map(r=>r.map(c=>/[",\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='帳號匯入範本.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function batchCreate(){
  const b=Sa.batch; if(!b) return;
  if(!b.role){ toast('請先選擇角色'); return; }
  const rows=b.rows.filter(r=>(r.id||'').trim());
  if(!rows.length){ toast('請至少填一個員工編號'); return; }
  const errs=[], seen=new Set();
  rows.forEach(r=>{ const id=(r.id||'').trim().toUpperCase();
    if(!/^[HT]\d{4}$/.test(id)) errs.push(`${id||'(空)'}：格式須 H/T+4碼`);
    else if(seen.has(id)) errs.push(`${id}：本批重覆`);
    else if(b.role==='foreign_care' && id.charAt(0)!=='T') errs.push(`${id}：外籍照服須 T 開頭`);
    else if(b.role!=='foreign_care' && id.charAt(0)==='T') errs.push(`${id}：T 開頭應設外籍照服`);
    seen.add(id);
  });
  if(errs.length){ toast('❌ '+errs.slice(0,4).join('；')+(errs.length>4?' …':'')); return; }
  const btn=document.getElementById('batch_btn'); if(btn){ btn.disabled=true; }
  let ok=0; const fail=[];
  for(const r of rows){
    const id=(r.id||'').trim().toUpperCase();
    if(btn) btn.textContent=`建立中… ${ok+fail.length}/${rows.length}`;
    try{
      const res=await adminUsers('create', { employeeId:id, name:id, role:b.role, password:BATCH_PW });
      if(res && res.id && (r.unit||'').trim()){ try{ await DB.setUserUnit(res.id, r.unit); }catch(_){} }
      if(res && res.id && b.role==='foreign_care'){ try{ await DB.setUserLang(res.id, r.lang||'vi'); }catch(_){} }
      ok++;
    }catch(e){ fail.push(`${id}：${(e.message||'').slice(0,40)}`); }
  }
  Sa.profiles=await DB.allProfiles(); Sa.batch=null; render();
  toast(fail.length ? `完成 ${ok} 個；失敗 ${fail.length}：${fail.slice(0,3).join('；')}` : `✅ 已建立 ${ok} 個帳號（預設密碼 ${BATCH_PW}）`);
}

async function handleFiles(input){
  const files=[...input.files]; if(!files.length) return;

/* 與草稿語言相容的測驗：zh→台籍測驗；vi/id→對應語言的外籍測驗 */
function compatibleQuizzes(lang){
  return lang==='zh'
    ? DB.quizzes().filter(q=>(q.audience||'local')==='local')
    : DB.quizzes().filter(q=>q.audience==='foreign' && q.lang===lang);
}
function firstCompatibleQuiz(lang){ const c=compatibleQuizzes(lang); return c[0]&&c[0].id; }
async function genFromMaterial(lang, kind){
  lang=lang||'zh'; kind=kind||'skill';

  if(text.length<10){ toast('請先貼上或上傳教材內容'); return; }
  toast('🤖 AI 出題中…（可能需幾秒）');
  try{
    const drafts=await aiQuestionsFromText(text, Sa.impN||5, {lang, kind});
    if(!drafts.length){ toast('沒有生成題目，請調整教材內容'); return; }
    Sa.drafts=drafts; Sa.draftLang=lang; Sa.draftKind=kind; Sa.draftQuiz=firstCompatibleQuiz(lang);
    render(); toast(`已生成 ${drafts.length} 題（${lang==='zh'?'中文':langName(lang)}）草稿，請審核`);
  }catch(e){ toast('❌ '+e.message.slice(0,100)); }
}
function draftsHTML(){

function draftCard(d,i){
  return `<div class="card draft">
    <div class="card-h">✏️ 草稿 ${i+1}</div>
    <label class="fld" style="margin-top:4px">題幹</label>
    <textarea oninput="Sa.drafts[${i}].stem=this.value">${esc(d.stem)}</textarea>
    <label class="fld">正確答案</label>
    <input value="${esc(d.correct)}" oninput="Sa.drafts[${i}].correct=this.value">
    <label class="fld">干擾項（3 個）</label>
    <div class="inline">
      <input value="${esc(d.distractors[0]||'')}" oninput="Sa.drafts[${i}].distractors[0]=this.value" style="flex:1;min-width:100px">
      <input value="${esc(d.distractors[1]||'')}" oninput="Sa.drafts[${i}].distractors[1]=this.value" style="flex:1;min-width:100px">
      <input value="${esc(d.distractors[2]||'')}" oninput="Sa.drafts[${i}].distractors[2]=this.value" style="flex:1;min-width:100px">
    </div>
    <label class="fld">📇 字卡完整答案（完整句子）</label>
    <textarea oninput="Sa.drafts[${i}].flash_answer=this.value">${esc(d.flash_answer||'')}</textarea>
    <label class="fld">📇 字卡詳細解說</label>
    <textarea oninput="Sa.drafts[${i}].explain=this.value">${esc(d.explain||'')}</textarea>
    <button class="btn sec block" style="margin-top:8px" onclick="genDraftExplain(${i})">🤖 生成教學解說（依本題內容）</button>
    <div class="inline" style="margin-top:12px">
      <button class="btn ghost" style="flex:1" onclick="discardDraft(${i})">捨棄</button>
      <button class="btn" style="flex:2" onclick="addDraft(${i})">✓ 加入題庫</button>
    </div>
  </div>`;
}
async function genDraftExplain(i){
  const d=Sa.drafts[i]; if(!d) return;
  const stem=(d.stem||'').trim(), correct=(d.correct||'').trim();
  if(!stem||!correct){ toast('請先填題幹與正解'); return; }
  toast('🤖 生成教學解說中…');
  try{ Sa.drafts[i].explain=await aiExplain(stem, correct, d.distractors, {lang:Sa.draftLang}); render(); toast('已生成教學解說，可再修改'); }
  catch(e){ toast('❌ '+e.message.slice(0,100)); }
}
function _draftValid(d){ const ds=(d.distractors||[]).map(x=>(x||'').trim()).filter(Boolean); return d.stem.trim()&&d.correct.trim()&&ds.length>=3; }
async function addDraft(i){
  const d=Sa.drafts[i], quiz_id=Sa.draftQuiz||firstCompatibleQuiz(Sa.draftLang);
  if(!quiz_id){ toast('請先建立對應語言的測驗'); return; }
  if(!_draftValid(d)){ toast('題幹、正解與 3 個干擾項為必填'); return; }
  try{
    await DB.addQuestion({ quiz_id, lang:Sa.draftLang, stem:d.stem.trim(), correct:d.correct.trim(),
      distractors:d.distractors.map(x=>x.trim()).filter(Boolean), explain:(d.explain||'').trim(), quiz_note:'', flash_answer:(d.flash_answer||'').trim() });
    Sa.drafts.splice(i,1); toast('已加入題庫'); render();
  }catch(e){ toast('加入失敗：'+e.message); }
}
async function addAllDrafts(){
  const quiz_id=Sa.draftQuiz||firstCompatibleQuiz(Sa.draftLang);
  if(!quiz_id){ toast('請先建立對應語言的測驗'); return; }
  let added=0; const keep=[];
  for(const d of Sa.drafts){
    if(_draftValid(d)){
      try{ await DB.addQuestion({ quiz_id, lang:Sa.draftLang, stem:d.stem.trim(), correct:d.correct.trim(),
        distractors:d.distractors.map(x=>x.trim()).filter(Boolean), explain:(d.explain||'').trim(), quiz_note:'', flash_answer:(d.flash_answer||'').trim() }); added++; }
      catch(e){ keep.push(d); }
    } else keep.push(d);
  }
  Sa.drafts=keep; toast(`已加入 ${added} 題${keep.length?`，${keep.length} 題資料不全保留`:''}`); render();
}
function discardDraft(i){ Sa.drafts.splice(i,1); render(); }

function toggleMgUnit(code, el){
  const i=Sa.mergeSel.indexOf(code);

  else { Sa.mergeSel.splice(i,1); el.classList.remove('sel'); }
}
function editMergeGroup(id){ const m=Sa.merges.find(x=>x.id===id); if(!m)return; Sa.editMerge=m; Sa.mergeSel=[...(m.units||[])]; window.scrollTo(0,0); render(); }
function cancelMerge(){ Sa.editMerge=null; Sa.mergeSel=[]; render(); }
async function saveMerge(){
  const name=(document.getElementById('mg_name').value||'').trim();
  if(!name){ toast('請輸入群組名稱'); return; }
  if(!Sa.mergeSel.length){ toast('請至少選一個單位'); return; }
  try{
    await DB.saveUnitMerge({ id:Sa.editMerge?Sa.editMerge.id:null, name, units:[...Sa.mergeSel] });
    Sa.merges=await DB.loadUnitMerges(); Sa.editMerge=null; Sa.mergeSel=[]; toast('已儲存'); render();
  }catch(e){ toast('儲存失敗：'+e.message); }
}
async function delMergeGroup(id){
  if(!confirm('確定刪除此合併群組？（單位與員工資料不會被刪除）')) return;
  try{ await DB.deleteUnitMerge(id); Sa.merges=await DB.loadUnitMerges(); toast('已刪除'); render(); }catch(e){ toast('刪除失敗：'+e.message); }
}

async function fillMissingFlash(btn){
  const box=document.getElementById('fill_result');
  await DB.loadForAdmin();
  const qs=DB.cache.allQuestions.filter(q=>!q.flash_answer||!q.flash_answer.trim());
  if(!qs.length){ box.innerHTML='<div class="fb g">✅ 所有題目都已有字卡完整答案</div>'; return; }
  if(!confirm(`要用 AI 幫 ${qs.length} 題缺少字卡完整答案的題目補上嗎？（可能需一點時間）`)) return;
  const orig=btn.textContent; btn.disabled=true;
  let done=0, fail=0;
  for(const q of qs){
    btn.textContent=`處理中… ${done+fail+1}/${qs.length}`;
    try{ const fa=await aiFlashAnswer(q.stem, q.correct); await DB.updateQuestion(q.id,{flash_answer:fa}); done++; }
    catch(e){ fail++; }
  }
  box.innerHTML=`<div class="fb ${fail?'b':'g'}">已補上 ${done}/${qs.length} 題${fail?`（${fail} 題失敗，可再按一次）`:''}</div>`;
  btn.disabled=false; btn.textContent=orig; toast('完成');
}
async function testAi(btn){
  const box=document.getElementById('ai_test_result');
  if(btn){ btn.disabled=true; btn.textContent='測試中…'; }
  box.innerHTML='<div class="note">🤖 呼叫後端中…</div>';
  try{
    const r=await aiPing();
    box.innerHTML=`<div class="fb g">✅ 連線成功（模型：${esc(r.model||'')}）<br>${esc(r.sample||'')}</div>`;
  }catch(e){
    box.innerHTML=`<div class="fb b">❌ ${esc(e.message)}<br><span class="muted">請確認 ai-generate 已部署、GEMINI_API_KEY 已設定。</span></div>`;
  }finally{ if(btn){ btn.disabled=false; btn.textContent='測試 AI 連線'; } }
}

      : `<div class="note" style="margin:0 0 10px">共 ${r.total} 個中文詞、成對 ${r.pairs} 個，發現 <b>${issues}</b> 個要處理：</div>
         ${r.missing.length? `<div class="fb b" style="margin-bottom:8px">🈳 缺對應語言 ${r.missing.length} 個<div class="mini" style="margin-top:4px">${r.missing.slice(0,10).map(m=>`${esc(m.zh)}<span style="opacity:.6">→缺${langOf(m.missLang).flag}</span>`).join('、')}${r.missing.length>10?' …':''}</div></div>
            <button class="btn amber block" style="margin-bottom:10px" onclick="vocabFixMissing()">🔧 補建缺少的 ${r.missing.length} 張（複製共用欄位、意思留空待 AI 補）</button>`:''}
         ${r.mismatch.length? `<div class="fb b" style="margin-bottom:8px">⚠️ 分類/拼音不一致 ${r.mismatch.length} 個<div class="mini" style="margin-top:4px">${r.mismatch.slice(0,10).map(m=>esc(m.zh)).join('、')}${r.mismatch.length>10?' …':''}</div></div>
            <button class="btn sec block" onclick="vocabAlignShared()">↔️ 一鍵對齊共用欄位（拼音／主題／級別／中文例句）</button>`:''}`}
    </div>`; })()}

  ${(()=>{ const miss=cards.filter(c=>!(c.meaning||'').trim()).length, b=Sa.vocabBatch;
    if(!miss && !(b&&b.running)) return '';
    return `<div class="card">
    <div class="card-h">🤖 批次 AI 補完（${langName(L)}）</div>
    <div class="note" style="margin:0 0 8px">替<b>還沒有母語意思</b>的卡自動補：拼音／意思／👴長輩例句＋🧑‍⚕️照顧者回話。可隨時停止，之後再按會接著補（不重覆已完成的）。</div>
    ${(b&&b.running)
      ? `<div class="fb" style="margin-bottom:8px">⏳ 補完中 ${b.done}/${b.total}…${b.fail?`（失敗 ${b.fail}）`:''}</div><button class="btn sec block" onclick="if(Sa.vocabBatch)Sa.vocabBatch.stop=true">■ 停止</button>`
      : `<button class="btn amber block" onclick="vocabEnrichMissing()">🤖 補完這 ${miss} 張缺意思的卡</button>
         <div class="mini" style="margin-top:6px;text-align:center">免費額度有速率限制，會慢慢補（每張約幾秒），可留著頁面讓它跑。</div>`}
    </div>`; })()}

  <div class="sect">現有單字卡（${langName(L)} · ${cards.length}）</div>
  ${cards.length? Object.keys(byTheme).map(th=>`
    <div class="card">
      <div class="card-h" style="font-size:14px">${esc(th)}（${byTheme[th].length}）</div>
      ${byTheme[th].map(vocabRow).join('')}
    </div>`).join('') : '<div class="card"><div class="empty">尚無單字卡，用上面三種方式新增。</div></div>'}`;
}
/* 可編輯的工作卡（新增或編輯共用；欄位綁 Sa.vocabEditingList[i]） */
function vocabEditor(d, i){
  const ll=langOf(d.lang||Sa.vocabLang);
  const f=(label,key,ph)=>`<label class="fld">${label}</label><input value="${esc(d[key]||'')}" oninput="Sa.vocabEditingList[${i}].${key}=this.value" placeholder="${ph||''}">`;
  return `<div class="card draft" style="margin-top:12px">
    <div class="card-h" style="font-size:14px">${d.id?'✏️ 編輯卡':'📇 新卡'}　<span class="tag amber">${ll.flag} ${ll.name}</span></div>
    ${f('中文（繁體）','zh')}
    ${f('拼音（含聲調）','pinyin','dùzi tòng')}
    ${f('母語意思（'+ll.name+'）','meaning')}
    <div class="mini" style="margin-top:10px;color:var(--muted)">👴 長輩會說的</div>
    ${f('例句（中文）','example_zh')}
    ${f('例句拼音','example_pinyin')}
    ${f('例句母語翻譯','example_native')}
    <div class="mini" style="margin-top:10px;color:var(--muted)">🧑‍⚕️ 照顧員回應</div>
    ${f('回應例句（中文）','example_staff_zh')}
    ${f('回應例句拼音','example_staff_pinyin')}
    ${f('回應例句母語翻譯','example_staff_native')}
    <div class="inline">
      <div style="flex:1;min-width:120px"><label class="fld">主題</label>
        <select onchange="Sa.vocabEditingList[${i}].theme=this.value"><option value="">— 選主題 —</option>${VTHEMES.map(t=>`<option value="${esc(t)}" ${d.theme===t?'selected':''}>${esc(t)}</option>`).join('')}${d.theme&&!VTHEMES.includes(d.theme)?`<option value="${esc(d.theme)}" selected>${esc(d.theme)}（舊）</option>`:''}</select></div>
      <div style="min-width:110px"><label class="fld">級別</label>
        <select onchange="Sa.vocabEditingList[${i}].level=this.value"><option value="basic" ${d.level==='basic'?'selected':''}>基礎</option><option value="advanced" ${d.level==='advanced'?'selected':''}>進階</option></select></div>
    </div>
    <div class="inline" style="margin-top:12px">
      <button class="btn ghost" style="flex:1" onclick="vocabCancel(${i})">取消</button>
      <button class="btn" style="flex:2" onclick="vocabSaveOne(${i})">${d.id?'更新':'✓ 加入'}</button>
    </div>
  </div>`;
}
function vocabRow(c){
  return `<div class="row-item">
    <div class="row-body">
      <div class="t">${esc(c.zh)} <span class="mini">${esc(c.pinyin||'')}</span></div>
      <div class="s">${esc(c.meaning||'')}${c.example_zh?'<br>👴 '+esc(c.example_zh):''}${c.example_staff_zh?'<br>🧑‍⚕️ '+esc(c.example_staff_zh):''}</div>
      <div class="tags"><span class="tag">${esc(c.theme||'其他')}</span><span class="tag ${c.level==='advanced'?'amber':'teal'}">${c.level==='advanced'?'進階':'基礎'}</span></div>
    </div>
    <div class="rowbtns">
      <button class="btn sec sm" onclick="editVocab('${c.id}')">編輯</button>
      <button class="btn danger sm" onclick="delVocab('${c.id}')">刪除</button>
    </div>
  </div>`;
}
function editVocab(id){ const c=DB.vocab().find(x=>x.id===id); if(!c)return; Sa.vocabEditingList=[{...c}]; window.scrollTo(0,0); render(); }
function vocabCancel(i){ Sa.vocabEditingList.splice(i,1); render(); }
async function vocabEnrich(){
  const zh=(Sa.vzh||'').trim(); if(!zh){ toast('請先輸入中文'); return; }
  const langs = Sa.vocabBoth ? ['vi','id'] : [Sa.vocabLang];
  Sa.vocabBusy=true; Sa.vocabEditingList=[]; render();
  try{
    const list=[];
    for(const lg of langs){ const c=await aiVocabEnrich(zh, lg); c.lang=lg; list.push(c); }
    Sa.vocabEditingList=list; Sa.vocabBusy=false; render(); toast('已補完 '+list.length+' 張，請審核');
  }catch(e){ Sa.vocabBusy=false; render(); toast('❌ '+e.message.slice(0,100)); }
}
function vocabBlank(){
  const langs = Sa.vocabBoth ? ['vi','id'] : [Sa.vocabLang];
  Sa.vocabEditingList = langs.map(lg=>({ lang:lg, zh:(Sa.vzh||'').trim(), pinyin:'', meaning:'', example_zh:'', example_pinyin:'', example_native:'', theme:'', level:'basic' }));
  render();
}
function _vocabPayload(d){ return { zh:(d.zh||'').trim(), pinyin:(d.pinyin||'').trim(), meaning:(d.meaning||'').trim(),
  example_zh:(d.example_zh||'').trim(), example_pinyin:(d.example_pinyin||'').trim(), example_native:(d.example_native||'').trim(),
  example_staff_zh:(d.example_staff_zh||'').trim(), example_staff_pinyin:(d.example_staff_pinyin||'').trim(), example_staff_native:(d.example_staff_native||'').trim(),
  theme:(d.theme||'其他').trim(), level:(d.level==='advanced'?'advanced':'basic') }; }
/* 批次補完：把目前語言中「缺母語意思」的卡逐一送 AI 補完（可停止、可續補、不重覆） */
async function vocabEnrichMissing(){
  const L=Sa.vocabLang;
  const targets=DB.vocab().filter(c=>c.lang===L && !(c.meaning||'').trim());
  if(!targets.length){ toast('沒有需要補完的卡'); return; }
  Sa.vocabBatch={ running:true, done:0, total:targets.length, fail:0, stop:false };
  render();
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  for(const c of targets){
    if(Sa.vocabBatch.stop) break;
    let ok=false;
    for(let tryn=0; tryn<3 && !ok && !Sa.vocabBatch.stop; tryn++){
      try{
        const ai=await aiVocabEnrich(c.zh, c.lang);
        const merged={ ...ai, zh:c.zh, theme:c.theme||ai.theme, level:c.level||ai.level };
        if(!(merged.meaning||'').trim()) throw new Error('empty');
        await DB.updateVocabCard(c.id, _vocabPayload(merged));
        ok=true;
      }catch(e){
        const m=String(e&&e.message||e);
        if(/429|rate|quota|limit|exhaust/i.test(m)) await sleep(9000);
        else if(tryn<2) await sleep(2000);
      }
    }
    Sa.vocabBatch.done++; if(!ok) Sa.vocabBatch.fail++;
    render();
    if(!Sa.vocabBatch.stop) await sleep(1500);   // 尊重免費額度速率
  }
  const b=Sa.vocabBatch, stopped=b.stop, done=b.done, fail=b.fail;
  Sa.vocabBatch=null; render();
  toast(stopped ? `已停止（成功 ${done-fail} 張，可稍後再按繼續）`
                : `✅ 補完結束（成功 ${done-fail}／${done}${fail?`，失敗 ${fail}`:''}）`);
}
/* ---------- 雙語同步：以中文(zh)為概念鍵，檢查兩語言是否成對、共用欄位是否一致 ---------- */
const VSHARED=['pinyin','theme','level'];
function vocabSyncReport(){
  const all=DB.vocab(), langs=LANGS.map(l=>l.key), byZh={};
  all.forEach(c=>{ (byZh[c.zh]=byZh[c.zh]||{})[c.lang]=c; });
  const zhs=Object.keys(byZh), missing=[], mismatch=[]; let pairs=0;
  zhs.forEach(zh=>{
    const m=byZh[zh], present=langs.filter(k=>m[k]);
    if(present.length<langs.length){
      langs.filter(k=>!m[k]).forEach(missLang=>missing.push({ zh, missLang, src:m[present[0]] }));
    } else {
      pairs++;
      if(VSHARED.some(f=>String(m[langs[0]][f]||'').trim()!==String(m[langs[1]][f]||'').trim()))
        mismatch.push({ zh, cards:langs.map(k=>m[k]) });
    }
  });
  return { total:zhs.length, pairs, missing, mismatch };
}
async function vocabFixMissing(){
  const r=vocabSyncReport(); if(!r.missing.length){ toast('沒有要補建的'); return; }
  if(!confirm(`將補建 ${r.missing.length} 張缺少語言的卡（複製中文/拼音/主題/級別與中文例句，母語意思留空，之後用「批次 AI 補完」補齊）。繼續？`)) return;
  const rows=r.missing.map(m=>({ lang:m.missLang, zh:m.zh, pinyin:m.src.pinyin||'', meaning:'',
    example_zh:m.src.example_zh||'', example_pinyin:m.src.example_pinyin||'', example_native:'',
    example_staff_zh:m.src.example_staff_zh||'', example_staff_pinyin:m.src.example_staff_pinyin||'', example_staff_native:'',
    theme:m.src.theme||'其他', level:m.src.level||'basic' }));
  try{ await DB.addVocabCards(rows); toast(`已補建 ${rows.length} 張，記得到該語言按「批次 AI 補完」補意思`); render(); }
  catch(e){ toast('補建失敗：'+e.message); }
}
async function vocabAlignShared(){
  const r=vocabSyncReport(); if(!r.mismatch.length){ toast('沒有不一致的'); return; }
  if(!confirm(`將把 ${r.mismatch.length} 個字的共用欄位（拼音/主題/級別/中文例句）以「意思較完整那張」為準對齊到另一語言。母語意思不受影響。繼續？`)) return;
  let n=0;
  try{
    for(const mm of r.mismatch){
      const [a,b]=mm.cards, src=(a.meaning||'').trim().length>=(b.meaning||'').trim().length? a:b, dst=(src===a?b:a);
      await DB.updateVocabCard(dst.id, { pinyin:src.pinyin||'', theme:src.theme||'其他', level:src.level||'basic',
        example_zh:src.example_zh||'', example_pinyin:src.example_pinyin||'',
        example_staff_zh:src.example_staff_zh||'', example_staff_pinyin:src.example_staff_pinyin||'' });
      n++;
    }
    toast(`已對齊 ${n} 個字`); render();
  }catch(e){ toast('對齊失敗：'+e.message); render(); }
}
async function vocabSaveOne(i){
  const d=Sa.vocabEditingList[i]; if(!d) return;
  if(!(d.zh||'').trim()||!(d.meaning||'').trim()){ toast('中文與母語意思為必填'); return; }
  try{
    if(d.id){ await DB.updateVocabCard(d.id, _vocabPayload(d)); toast('已更新'); }
    else { await DB.addVocabCard({ lang:d.lang||Sa.vocabLang, ..._vocabPayload(d) }); toast('已加入'); }
    Sa.vocabEditingList.splice(i,1); if(!Sa.vocabEditingList.length) Sa.vzh=''; render();
  }catch(e){ toast('儲存失敗：'+e.message); }
}
async function vocabSaveAll(){
  const list=Sa.vocabEditingList.filter(d=>(d.zh||'').trim()&&(d.meaning||'').trim());
  if(!list.length){ toast('中文與母語意思為必填'); return; }
  toast('加入中…');
  try{
    const news=list.filter(d=>!d.id).map(d=>({ lang:d.lang||Sa.vocabLang, ..._vocabPayload(d) }));
    if(news.length) await DB.addVocabCards(news);
    for(const d of list.filter(x=>x.id)){ await DB.updateVocabCard(d.id, _vocabPayload(d)); }
    Sa.vocabEditingList=[]; Sa.vzh=''; toast('已加入'); render();
  }catch(e){ toast('加入失敗：'+e.message); }
}
async function delVocab(id){ if(!confirm('確定刪除此單字卡？'))return; try{ await DB.delVocabCard(id); toast('已刪除'); render(); }catch(e){ toast('刪除失敗：'+e.message); } }
async function vocabHandleFiles(input){
  const files=[...input.files]; if(!files.length) return;
  for(const f of files){ try{ const t=await extractTextFromFile(f); if(t&&t.trim()){ Sa.vocabMaterial=(Sa.vocabMaterial?Sa.vocabMaterial+'\n':'')+t.trim(); toast('已匯入：'+f.name); } }catch(e){ toast(f.name+'：'+(e.message||'讀取失敗')); } }
  input.value=''; render();
}
async function vocabSplit(){
  const text=(Sa.vocabMaterial||'').trim(); if(text.length<4){ toast('請先貼上或上傳中文教材'); return; }
  const langs = Sa.vocabBoth ? ['vi','id'] : [Sa.vocabLang];
  Sa.vocabBusy=true; render();
  try{
    let drafts=[];
    for(const lg of langs){ const cards=await aiVocabSplit(text, lg, Sa.vocabN||'auto'); cards.forEach(c=>c.lang=lg); drafts=drafts.concat(cards); }
    Sa.vocabBusy=false;
    if(!drafts.length){ render(); toast('沒有拆出卡片'); return; }
    Sa.vocabDrafts=drafts; render(); toast('已拆 '+drafts.length+' 張，請審核');
  }catch(e){ Sa.vocabBusy=false; render(); toast('❌ '+e.message.slice(0,100)); }
}
function vocabDraftsHTML(){
  return `<div class="sect" style="margin-top:14px">拆出的卡（${Sa.vocabDrafts.length}）· 審核後加入</div>
    <button class="btn block" style="margin-bottom:10px" onclick="vocabAddAllDrafts()">✓ 全部加入（${Sa.vocabDrafts.length}）</button>
    ${Sa.vocabDrafts.map((d,i)=>`<div class="card draft">
      <div class="card-h" style="justify-content:space-between;font-size:14px"><span>${langOf(d.lang||Sa.vocabLang).flag} ${esc(d.zh)} <span class="mini">${esc(d.pinyin||'')}</span></span><button class="btn ghost sm" onclick="Sa.vocabDrafts.splice(${i},1);render()">捨棄</button></div>
      <div class="s" style="color:var(--muted);font-size:13px">${esc(d.meaning||'')}${d.example_zh?'<br>👴 '+esc(d.example_zh):''}${d.example_staff_zh?'<br>🧑‍⚕️ '+esc(d.example_staff_zh):''}</div>
      <div class="tags" style="margin-top:6px"><span class="tag">${esc(d.theme||'其他')}</span><span class="tag ${d.level==='advanced'?'amber':'teal'}">${d.level==='advanced'?'進階':'基礎'}</span></div>
    </div>`).join('')}`;
}
async function vocabAddAllDrafts(){
  const rows=Sa.vocabDrafts.filter(d=>(d.zh||'').trim()&&(d.meaning||'').trim()).map(d=>({ lang:d.lang||Sa.vocabLang, ..._vocabPayload(d) }));
  if(!rows.length){ toast('沒有可加入的卡'); return; }
  toast('加入中…');
  try{ await DB.addVocabCards(rows); Sa.vocabDrafts=[]; toast('已加入 '+rows.length+' 張'); render(); }
  catch(e){ toast('加入失敗：'+e.message); }
}

/* ---------- 啟動 ---------- */
boot();
</script>
