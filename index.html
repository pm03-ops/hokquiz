<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>照護學堂 · 線上測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<div id="root"><div class="shell"><div class="auth"><div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div><div class="tag2">載入中…</div></div></div></div></div>
<div id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=9"></script>
<script src="db.js?v=10"></script>
<script>
/* =====================================================================
   前台 index.html —— 員工登入 / 首頁 / 字卡 / 測驗 / 複習 / 排行
   資料來自 Supabase（db.js / Auth）。
   ===================================================================== */

const S = { view:'home', play:null, flash:null };
const root=()=>document.getElementById('root');
const me =()=>DB.me();

/* =====================================================================
   啟動：檢查 session → 路由
   ===================================================================== */
async function boot(){
  try{
    const s=await Auth.session();
    if(!s){ renderLogin(); return; }
    await Auth.loadProfile();
    await route();
  }catch(e){ renderLogin(e.message); }
}
async function route(){
  const u=me();
  if(!u){ renderLogin(); return; }
  if(u.role==='admin'){ renderAdminLanding(); return; }
  if(Auth.mustChangePassword()){ renderForceChange(); return; }
  try{ await DB.loadForStaff(); }catch(e){ toast('資料載入失敗：'+e.message); }
  render();
}
function go(v){ S.view=v; window.scrollTo(0,0); render(); }

/* =====================================================================
   登入
   ===================================================================== */
function renderLogin(errMsg){
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">養老院線上測驗與學習平台</div></div>
    <div class="card">
      <div class="card-h">🔑 員工登入</div>
      <label class="fld">員工編號</label>
      <input id="lg_id" placeholder="例如 H1974" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      <label class="fld">密碼</label>
      <input id="lg_pw" type="password" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      ${errMsg?`<div class="fb b" style="margin-top:12px">❌ ${esc(errMsg)}</div>`:''}
      <button class="btn block" style="margin-top:16px" id="lg_btn" onclick="doLogin()">登入</button>
      <div class="note center" style="margin-top:14px">忘記密碼或需要帳號？請洽管理員。</div>
    </div>
  </div></div>`;
  const el=document.getElementById('lg_id'); if(el) el.focus();
}
async function doLogin(){
  const id=(document.getElementById('lg_id').value||'').trim();
  const pw=document.getElementById('lg_pw').value||'';
  if(!id||!pw){ toast('請輸入員工編號與密碼'); return; }
  const btn=document.getElementById('lg_btn'); if(btn){ btn.disabled=true; btn.textContent='登入中…'; }
  try{ await Auth.login(id, pw); await route(); }
  catch(e){
    const msg = /Invalid login/i.test(e.message)?'員工編號或密碼錯誤':e.message;
    renderLogin(msg);
  }
}

/* =====================================================================
   首次登入強制改密碼
   ===================================================================== */
function renderForceChange(){
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">首次登入 · 請設定新密碼</div></div>
    <div class="card">
      <div class="card-h">🔒 設定你的新密碼</div>
      <div class="note" style="margin:0 0 12px">為了帳號安全，首次登入請將管理員給你的預設密碼改成只有你知道的密碼。</div>
      <label class="fld">新密碼（至少 6 碼）</label>
      <input id="pc_a" type="password" placeholder="輸入新密碼">
      <label class="fld">再次輸入新密碼</label>
      <input id="pc_b" type="password" placeholder="再次輸入" onkeydown="if(event.key==='Enter')doForceChange()">
      <div id="pc_msg"></div>
      <button class="btn block" style="margin-top:16px" id="pc_btn" onclick="doForceChange()">儲存並進入</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="Auth.logout().then(()=>renderLogin())">登出</button>
    </div>
  </div></div>`;
}
async function doForceChange(){
  const a=document.getElementById('pc_a').value||'', b=document.getElementById('pc_b').value||'';
  const msg=document.getElementById('pc_msg');
  if(a.length<6){ msg.innerHTML='<div class="fb b" style="margin-top:12px">密碼至少 6 碼</div>'; return; }
  if(a!==b){ msg.innerHTML='<div class="fb b" style="margin-top:12px">兩次輸入的密碼不一致</div>'; return; }
  const btn=document.getElementById('pc_btn'); btn.disabled=true; btn.textContent='儲存中…';
  try{ await Auth.changePassword(a); toast('密碼已更新'); await route(); }
  catch(e){ msg.innerHTML=`<div class="fb b" style="margin-top:12px">❌ ${esc(e.message)}</div>`; btn.disabled=false; btn.textContent='儲存並進入'; }
}

/* =====================================================================
   管理員登入前台 → 導向後台
   ===================================================================== */
function renderAdminLanding(){
  const u=me();
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">管理員 · ${esc(u.name)}</div></div>
    <div class="card">
      <div class="card-h">🛠️ 管理員登入</div>
      <div class="note" style="margin:0 0 14px">你是管理員帳號。請選擇要前往的頁面：</div>
      <a class="btn block" href="admin.html">📋 題庫管理後台</a>
      <a class="btn sec block" style="margin-top:10px" href="report.html">📊 主管報表</a>
      <button class="btn ghost block" style="margin-top:10px" onclick="Auth.logout().then(()=>renderLogin())">登出</button>
    </div>
  </div></div>`;
}

/* =====================================================================
   員工介面殼
   ===================================================================== */
function render(){
  ({home:renderHome, flash:renderFlashList, quizzes:renderQuizList,
    review:renderReview, leaderboard:renderLeaderboard }[S.view]||renderHome)();
}
function shell(inner, tab){
  const u=me(), r=roleOf(u.role);
  const tabs=[{k:'home',e:'🏠',n:'首頁'},{k:'flash',e:'📇',n:'字卡'},{k:'quizzes',e:'📝',n:'測驗'},{k:'review',e:'🔁',n:'複習'},{k:'leaderboard',e:'🏆',n:'排行'}];
  return `<div class="shell">
    <div class="topbar">
      <div class="brand"><span class="mark">✚</span>照護<b>學堂</b></div>
      <div class="grow"></div>
      <div class="userchip"><span class="avatar" style="background:${r.color}">${esc(initials(u.name))}</span></div>
      <button class="iconbtn" title="登出" onclick="Auth.logout().then(()=>renderLogin())">⏻</button>
    </div>
    <div class="content">${inner}</div>
    <nav class="tabbar">
      ${tabs.map(t=>`<button class="${tab===t.k?'on':''}" onclick="go('${t.k}')"><span class="e">${t.e}</span>${t.n}</button>`).join('')}
    </nav>
  </div>`;
}

/* =====================================================================
   首頁
   ===================================================================== */
function renderHome(){
  const u=me(), t=todayNum();
  const due=DB.dueReviews(t).length;
  const quizzes=DB.quizzesFor(u.role);
  root().innerHTML=shell(`
    <div class="greet">嗨，${esc(u.name)} 👋<span class="sub">${roleOf(u.role).emoji} ${roleName(u.role)} · 今天也一起學習吧</span></div>
    <div class="stats" style="margin-top:16px">
      <div class="tile"><div class="ic teal">⭐</div><div class="num">${u.points}</div><div class="lbl">總積分</div></div>
      <div class="tile"><div class="ic amber">🔥</div><div class="num">${u.streak}</div><div class="lbl">連續天數</div></div>
      <div class="tile"><div class="ic gold">✅</div><div class="num">${u.answered}</div><div class="lbl">累積答對</div></div>
    </div>
    ${due? `<div class="card" style="margin-top:12px;display:flex;align-items:center;gap:13px">
      <div class="thumb" style="background:var(--accent-soft)">🔁</div>
      <div class="row-body"><div class="t">今日待複習 <span class="pill">${due}</span></div>
        <div class="s">趁記憶還在，用間隔複習法最有效</div></div>
      <button class="btn amber sm" onclick="go('review')">複習</button>
    </div>`:''}
    <div class="sect">開放給你的測驗</div>
    <div class="card">
      ${quizzes.length? quizzes.map(q=>quizRow(q,true)).join('') : '<div class="empty"><span class="e">📭</span>目前沒有開放的測驗</div>'}
    </div>
    <div class="sect">我的徽章</div>
    <div class="card"><div class="badges">
      ${DB.badgeDefs().map(b=>`<span class="badge ${DB.myBadges().includes(b.key)?'on':'locked'}">${b.emoji} ${b.name}</span>`).join('')||'<span class="muted">尚無徽章</span>'}
    </div></div>
  `,'home');
}
function quizRow(q, showFlash){
  return `<div class="row-item">
    <div class="thumb">${q.emoji||'📘'}</div>
    <div class="row-body">
      <div class="t">${esc(q.title)}</div>
      <div class="s">${esc(q.descr||'')}</div>
      <div class="tags">${(q.roles||[]).map(r=>`<span class="tag teal">${roleName(r)}</span>`).join('')}</div>
    </div>
    <div class="rowbtns">
      ${showFlash?`<button class="btn sec sm" onclick="openFlash('${q.id}')">字卡</button>`:''}
      <button class="btn sm" onclick="startQuiz('${q.id}')">測驗</button>
    </div>
  </div>`;
}

/* =====================================================================
   字卡（先學）—— 獨立區：顯示題目 + 正解 + 詳細解說
   ===================================================================== */
function renderFlashList(){
  const quizzes=DB.quizzesFor(me().role);
  root().innerHTML=shell(`
    <div class="sect">📇 學習字卡</div>
    <div class="admin-hint">💡 字卡是「先學」：直接看題目、正確答案與完整解說，讀熟了再去「測驗」自我檢測。</div>
    <div class="card">
      ${quizzes.length? quizzes.map(q=>`<div class="row-item">
        <div class="thumb">${q.emoji||'📘'}</div>
        <div class="row-body"><div class="t">${esc(q.title)}</div><div class="s">${esc(q.descr||'')}</div></div>
        <button class="btn sm" onclick="openFlash('${q.id}')">讀字卡 →</button>
      </div>`).join('') : '<div class="empty"><span class="e">📭</span>目前沒有開放的測驗</div>'}
    </div>
  `,'flash');
}
async function openFlash(quizId){
  try{
    const cards=await DB.ensureFlash(quizId);
    if(!cards.length){ toast('這份測驗還沒有題目'); return; }
    S.flash={ quizId, idx:0, list:cards, reveal:false }; S.view='flash'; renderFlashCard();
  }catch(e){ toast('載入失敗：'+e.message); }
}
function renderFlashCard(){
  const F=S.flash, c=F.list[F.idx], quiz=DB.quiz(F.quizId)||{};
  const cap='font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted)';
  const answer=(c.flash_answer && c.flash_answer.trim()) ? c.flash_answer : c.correct;   // 舊題無 flash_answer 時退回簡短正解
  root().innerHTML=shell(`
    <div class="qhead"><span>📇 ${esc(quiz.title||'字卡')}</span><span>${F.idx+1} / ${F.list.length}</span></div>
    <div class="bar"><i style="width:${(F.idx+1)/F.list.length*100}%"></i></div>
    <div class="card" style="padding:26px 22px;min-height:200px">
      <div class="cap" style="${cap}">${F.reveal?'🔄 背面 · 解答':'題目'}</div>
      <div style="font-size:20px;font-weight:800;line-height:1.5;margin:10px 0 4px">${esc(c.stem)}</div>
      ${F.reveal? `
        <div class="cap" style="${cap};margin-top:22px">✅ 答案</div>
        <div class="fb g" style="text-align:left;margin-top:8px;font-size:16px;font-weight:700;line-height:1.6">${esc(answer)}</div>
        ${c.explain? `<div class="cap" style="${cap};margin-top:16px">📖 說明</div>
          <div class="fb g" style="text-align:left;margin-top:8px">${esc(c.explain)}</div>`:''}
      ` : `<div class="note center" style="margin-top:26px">先想想答案，再翻到背面對照</div>
           <button class="btn block" style="margin-top:12px" onclick="flashReveal()">🔄 翻到背面看答案</button>`}
    </div>
    <div class="inline" style="margin-top:16px">
      <button class="btn sec" style="flex:1" onclick="flashPrev()" ${F.idx?'':'disabled'}>上一張</button>
      ${F.idx===F.list.length-1
        ? `<button class="btn" style="flex:2" onclick="go('flash')">完成 ✓</button>`
        : `<button class="btn" style="flex:2" onclick="flashNext()">下一張 →</button>`}
    </div>
  `,'flash');
}
function flashReveal(){ S.flash.reveal=true; renderFlashCard(); }
function flashNext(){ if(S.flash.idx<S.flash.list.length-1){ S.flash.idx++; S.flash.reveal=false; renderFlashCard(); } }
function flashPrev(){ if(S.flash.idx>0){ S.flash.idx--; S.flash.reveal=false; renderFlashCard(); } }

/* =====================================================================
   測驗列表
   ===================================================================== */
function renderQuizList(){
  const u=me(), quizzes=DB.quizzesFor(u.role);
  root().innerHTML=shell(`
    <div class="sect">📝 全部測驗</div>
    <div class="admin-hint">💡 測驗會即時評分並記錄成績；作答時看不到正解，答完才會顯示對錯與重點提示。</div>
    <div class="card">${quizzes.length? quizzes.map(q=>quizRow(q,false)).join('') : '<div class="empty"><span class="e">📭</span>目前沒有開放的測驗</div>'}</div>
    <div class="note center" style="margin-top:14px">只顯示開放給你角色（${roleName(u.role)}）的測驗</div>
  `,'quizzes');
}

/* =====================================================================
   作答（伺服器評分）
   ===================================================================== */
async function startQuiz(quizId){
  try{
    const qs=await DB.ensureQuizQuestions(quizId);
    if(!qs.length){ toast('這份測驗還沒有題目'); return; }
    S.play={ quizId, sessionId:newSessionId(), title:(DB.quiz(quizId)||{}).title||'測驗',
      list:shuffle(qs), idx:0, answered:false, correctCount:0, pointsEarned:0 };
    S.view='quizzes'; renderPlay();
  }catch(e){ toast('載入失敗：'+e.message); }
}
function renderPlay(){
  const P=S.play, cur=P.list[P.idx], keys=['A','B','C','D','E','F'];
  root().innerHTML=shell(`
    <div class="qhead"><span>${esc(P.title)}</span><span>${P.idx+1} / ${P.list.length}</span></div>
    <div class="bar"><i style="width:${P.idx/P.list.length*100}%"></i></div>
    <div class="stem">${esc(cur.stem)}</div>
    <div id="opts">
      ${(cur.options||[]).map((o,i)=>`<button class="opt" onclick="answerQuiz(this,${JSON.stringify(o).replace(/"/g,'&quot;')})"><span class="key">${keys[i]||'?'}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
  `,'quizzes');
}
async function answerQuiz(btn, chosen){
  const P=S.play; if(P.answered) return; P.answered=true;
  document.querySelectorAll('#opts .opt').forEach(b=>b.disabled=true);
  document.getElementById('fb').innerHTML='<div class="note center">評分中…</div>';
  const cur=P.list[P.idx];
  try{
    const res=await DB.grade(P.sessionId, P.quizId, cur.id, chosen);
    DB.applyGradeResult(P.quizId, cur.id, res);
    if(res.correct){ P.correctCount++; P.pointsEarned+=(res.gained||0); }
    document.querySelectorAll('#opts .opt').forEach(b=>{
      const txt=b.querySelector('span:last-child').textContent;
      if(txt===res.correctAnswer) b.classList.add('correct');
      else if(txt===chosen) b.classList.add('wrong');
    });
    document.getElementById('fb').innerHTML=`
      <div class="fb ${res.correct?'g':'b'}">
        <div class="h">${res.correct?`✅ 答對了！ +${res.gained||0} 分`:'❌ 答錯了'}</div>
        ${res.correct?'':`正確答案：<b>${esc(res.correctAnswer||'')}</b><br>`}${res.quizNote?'💡 '+esc(res.quizNote):''}
      </div>
      <button class="btn block" style="margin-top:14px" onclick="nextQ()">${P.idx===P.list.length-1?'看成績':'下一題'} →</button>`;
    document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){
    P.answered=false;
    document.querySelectorAll('#opts .opt').forEach(b=>b.disabled=false);
    document.getElementById('fb').innerHTML=`<div class="fb b">❌ 評分失敗：${esc(e.message)}</div>`;
  }
}
function nextQ(){ const P=S.play; if(P.idx<P.list.length-1){ P.idx++; P.answered=false; renderPlay(); } else finishQuiz(); }
async function finishQuiz(){
  const P=S.play;
  if(P.isReview){ toast(`複習完成！+${P.pointsEarned} 分`); go('home'); return; }
  try{ await DB.finish(P.sessionId, P.quizId); }catch(e){ /* 成績已於作答時逐題記錄，仍顯示結果 */ }
  renderResult();
}
function renderResult(){
  const P=S.play, pct=Math.round(P.correctCount/P.list.length*100);
  const emoji=pct===100?'🏆':pct>=60?'😄':'💪';
  const line=pct===100?'完美！全部答對':pct>=60?'表現不錯，繼續加油':'再複習一下會更好';
  root().innerHTML=shell(`
    <div class="card center" style="padding:34px 22px">
      <div class="big-emoji">${emoji}</div>
      <h3 style="font-size:22px;font-weight:900;margin:12px 0 2px">${line}</h3>
      <div class="muted" style="font-size:13px">${esc(P.title)}</div>
      <div class="stats" style="margin-top:22px">
        <div class="tile"><div class="num">${P.correctCount}/${P.list.length}</div><div class="lbl">答對題數</div></div>
        <div class="tile"><div class="num">${pct}%</div><div class="lbl">正確率</div></div>
        <div class="tile"><div class="num" style="color:var(--brand)">+${P.pointsEarned}</div><div class="lbl">獲得積分</div></div>
      </div>
      <div class="inline" style="margin-top:22px">
        <button class="btn sec" style="flex:1" onclick="startQuiz('${P.quizId}')">再測一次</button>
        <button class="btn" style="flex:1" onclick="go('home')">回首頁</button>
      </div>
    </div>
  `,'quizzes');
}

/* =====================================================================
   複習（SRS）—— 也走伺服器評分
   ===================================================================== */
async function renderReview(){
  const t=todayNum(), due=DB.dueReviews(t);
  if(!due.length){
    root().innerHTML=shell(`<div class="card center" style="padding:40px 22px">
      <div class="big-emoji">🎉</div>
      <h3 style="font-size:20px;font-weight:900;margin:12px 0 4px">今天沒有待複習</h3>
      <div class="note center">完成測驗後，題目會依「間隔複習法」自動排入複習清單。</div>
      <button class="btn" style="margin-top:18px" onclick="go('quizzes')">去做測驗</button>
    </div>`,'review'); return;
  }
  root().innerHTML=shell('<div class="note center" style="padding:40px">載入複習題目…</div>','review');
  try{
    const qs=await DB.questionsByIds(due.map(r=>r.question_id));
    if(!qs.length){ root().innerHTML=shell('<div class="empty">複習題目已不存在</div>','review'); return; }
    S.play={ quizId:'__review__', sessionId:newSessionId(), title:'🔁 今日複習',
      list:qs, idx:0, answered:false, correctCount:0, pointsEarned:0, isReview:true };
    renderPlay();
  }catch(e){ root().innerHTML=shell(`<div class="empty">載入失敗：${esc(e.message)}</div>`,'review'); }
}

/* =====================================================================
   排行榜
   ===================================================================== */
function renderLeaderboard(){
  const u=me();
  const rows=DB.leaderboard().slice().sort((a,b)=>b.points-a.points);
  root().innerHTML=shell(`
    <div class="sect">🏆 積分排行榜</div>
    <div class="card">
      ${rows.map((x,i)=>{ const r=roleOf(x.role); const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
        return `<div class="lb ${x.id===u.id?'mine':''}">
          <div class="rk ${i<3?'top':''}">${medal}</div>
          <span class="avatar" style="background:${r.color}">${esc(initials(x.name))}</span>
          <div class="row-body"><div class="t">${esc(x.name)} ${x.id===u.id?'<span class="tag teal">你</span>':''}</div>
            <div class="s">${roleName(x.role)} · 🔥${x.streak}天 · ✅${x.answered}題</div></div>
          <div class="pts">${x.points}<span>分</span></div>
        </div>`; }).join('') || '<div class="empty">尚無資料</div>'}
    </div>
  `,'leaderboard');
}

/* ---------- 啟動 ---------- */
boot();
</script>
</body>
</html>
