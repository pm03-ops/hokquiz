<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>照護學堂 · 線上測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<div id="root"><div class="shell"><div class="auth"><div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div><div class="tag2">載入中…</div></div></div></div></div>
<div id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=14"></script>
<script src="db.js?v=14"></script>
<script>
/* =====================================================================
   前台 index.html —— 員工登入 / 首頁 / 字卡 / 測驗 / 複習 / 排行
   資料來自 Supabase（db.js / Auth）。
   ===================================================================== */

const S = { view:'home', play:null, flash:null, study:null, mode:null, vunit:null, vidx:0, vflip:false, vprac:null, vspeak:null };
const root=()=>document.getElementById('root');
const me =()=>DB.me();

/* =====================================================================
   啟動：檢查 session → 路由
   ===================================================================== */
async function boot(){
  try{
    const s=await Auth.session();
    if(!s){ renderLogin(); return; }
    await Auth.loadProfile();
    await route();
  }catch(e){ renderLogin(e.message); }
}
async function route(){
  const u=me();
  if(!u){ renderLogin(); return; }
  if(u.role==='admin'){ renderAdminLanding(); return; }
  if(Auth.mustChangePassword()){ renderForceChange(); return; }
  try{ await DB.loadForStaff(); }catch(e){ toast('資料載入失敗：'+e.message); }
  render();
}
function go(v){ S.view=v; window.scrollTo(0,0); render(); }

/* =====================================================================
   登入
   ===================================================================== */
function renderLogin(errMsg){
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">養老院線上測驗與學習平台</div></div>
    <div class="card">
      <div class="card-h">🔑 員工登入</div>
      <label class="fld">員工編號</label>
      <input id="lg_id" placeholder="例如 H1974 或 T0001" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      <label class="fld">密碼</label>
      <input id="lg_pw" type="password" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      ${errMsg?`<div class="fb b" style="margin-top:12px">❌ ${esc(errMsg)}</div>`:''}
      <button class="btn block" style="margin-top:16px" id="lg_btn" onclick="doLogin()">登入</button>
      <button class="btn sec block" style="margin-top:10px" onclick="renderRegister()">📝 註冊新帳號</button>
      <div class="note center" style="margin-top:12px">忘記密碼請洽管理員。</div>
    </div>
  </div></div>`;
  const el=document.getElementById('lg_id'); if(el) el.focus();
}
async function doLogin(){
  const id=(document.getElementById('lg_id').value||'').trim();
  const pw=document.getElementById('lg_pw').value||'';
  if(!id||!pw){ toast('請輸入員工編號與密碼'); return; }
  const btn=document.getElementById('lg_btn'); if(btn){ btn.disabled=true; btn.textContent='登入中…'; }
  try{ await Auth.login(id, pw); await route(); }
  catch(e){
    const msg = /Invalid login/i.test(e.message)?'員工編號或密碼錯誤':e.message;
    renderLogin(msg);
  }
}

/* =====================================================================
   員工自行註冊
   ===================================================================== */
function renderRegister(){
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">註冊新帳號</div></div>
    <div class="card">
      <div class="card-h">📝 註冊</div>
      <label class="fld">員工編號（H＝台籍、<b>T＝外籍</b>，例：H0123 / T0123）</label>
      <input id="rg_id" placeholder="H0123 或 T0123" maxlength="5" oninput="this.value=this.value.toUpperCase();syncRgForeign()">
      <label class="fld">姓名</label>
      <input id="rg_name" placeholder="輸入你的姓名">
      <label class="fld">職類</label>
      <div class="chips" id="rg_role">
        ${ROLES.filter(r=>r.key!=='admin').map(r=>`<label class="chip-ck" data-role="${r.key}"><input type="radio" name="rgrole" value="${r.key}">${r.emoji} ${r.name}</label>`).join('')}
      </div>
      <div id="rg_lang_wrap" style="display:none">
        <label class="fld">語言（外籍照服）</label>
        <select id="rg_lang">${LANGS.map(l=>`<option value="${l.key}">${l.flag} ${l.name}</option>`).join('')}</select>
      </div>
      <label class="fld">所屬單位</label>
      <select id="rg_unit"><option value="">— 請選擇單位 —</option>${['C','D','E'].map(z=>`<optgroup label="區 ${z}">${UNITS.filter(u=>u.zone===z).map(u=>`<option value="${u.code}">${esc(u.name)}（${u.code}）</option>`).join('')}</optgroup>`).join('')}</select>
      <label class="fld">設定密碼（至少 6 碼）</label>
      <input id="rg_pw" type="password" placeholder="設定你的密碼">
      <label class="fld">再次輸入密碼</label>
      <input id="rg_pw2" type="password" placeholder="再次輸入" onkeydown="if(event.key==='Enter')doRegister()">
      <div id="rg_msg"></div>
      <button class="btn block" style="margin-top:16px" id="rg_btn" onclick="doRegister()">建立帳號</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="renderLogin()">← 返回登入</button>
    </div>
  </div></div>`;
  document.querySelectorAll('#rg_role input').forEach(rb=>{ rb.onchange=()=>{
    document.querySelectorAll('#rg_role .chip-ck').forEach(x=>x.classList.remove('sel'));
    rb.closest('.chip-ck').classList.add('sel'); syncRgForeign(); }; });
}
/* 註冊：T 開頭自動勾外籍；外籍才顯示語言 */
function syncRgForeign(){
  const idEl=document.getElementById('rg_id'); if(!idEl) return;
  const id=(idEl.value||'').trim().toUpperCase();
  const fr=document.querySelector('#rg_role input[value="foreign_care"]');
  if(id.charAt(0)==='T' && fr && !fr.checked){
    fr.checked=true;
    document.querySelectorAll('#rg_role .chip-ck').forEach(x=>x.classList.remove('sel'));
    fr.closest('.chip-ck').classList.add('sel');
  }
  const wrap=document.getElementById('rg_lang_wrap');
  if(wrap) wrap.style.display=(fr&&fr.checked)?'':'none';
}
function rgMsg(m){ const el=document.getElementById('rg_msg'); if(el) el.innerHTML=`<div class="fb b" style="margin-top:12px">❌ ${esc(m)}</div>`; }
async function doRegister(){
  const id=(document.getElementById('rg_id').value||'').trim().toUpperCase();
  const name=(document.getElementById('rg_name').value||'').trim();
  const role=(document.querySelector('#rg_role input:checked')||{}).value;
  const unit=document.getElementById('rg_unit').value||'';
  const pw=document.getElementById('rg_pw').value||'', pw2=document.getElementById('rg_pw2').value||'';
  if(!/^[HT]\d{4}$/.test(id)) return rgMsg('員工編號須為 H 或 T + 4 碼數字（H台籍／T外籍）');
  if(!name) return rgMsg('請輸入姓名');
  if(!role) return rgMsg('請選擇職類');
  if(role==='foreign_care' && id.charAt(0)!=='T') return rgMsg('外籍照服請使用 T 開頭的員工編號');
  if(id.charAt(0)==='T' && role!=='foreign_care') return rgMsg('T 開頭為外籍員工，職類請選「外籍照服」');
  if(!unit) return rgMsg('請選擇所屬單位');
  if(pw.length<6) return rgMsg('密碼至少 6 碼');
  if(pw!==pw2) return rgMsg('兩次輸入的密碼不一致');
  const lang = role==='foreign_care' ? (document.getElementById('rg_lang').value||'vi') : 'zh';
  const btn=document.getElementById('rg_btn'); btn.disabled=true; btn.textContent='建立中…';
  try{ await Auth.register(id, name, role, pw, unit, lang); await route(); }
  catch(e){ rgMsg(e.message); btn.disabled=false; btn.textContent='建立帳號'; }
}

/* =====================================================================
   首次登入強制改密碼
   ===================================================================== */
function renderForceChange(){
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">首次登入 · 請設定新密碼</div></div>
    <div class="card">
      <div class="card-h">🔒 設定你的新密碼</div>
      <div class="note" style="margin:0 0 12px">為了帳號安全，首次登入請將管理員給你的預設密碼改成只有你知道的密碼。</div>
      <label class="fld">新密碼（至少 6 碼）</label>
      <input id="pc_a" type="password" placeholder="輸入新密碼">
      <label class="fld">再次輸入新密碼</label>
      <input id="pc_b" type="password" placeholder="再次輸入" onkeydown="if(event.key==='Enter')doForceChange()">
      <div id="pc_msg"></div>
      <button class="btn block" style="margin-top:16px" id="pc_btn" onclick="doForceChange()">儲存並進入</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="Auth.logout().then(()=>renderLogin())">登出</button>
    </div>
  </div></div>`;
}
async function doForceChange(){
  const a=document.getElementById('pc_a').value||'', b=document.getElementById('pc_b').value||'';
  const msg=document.getElementById('pc_msg');
  if(a.length<6){ msg.innerHTML='<div class="fb b" style="margin-top:12px">密碼至少 6 碼</div>'; return; }
  if(a!==b){ msg.innerHTML='<div class="fb b" style="margin-top:12px">兩次輸入的密碼不一致</div>'; return; }
  const btn=document.getElementById('pc_btn'); btn.disabled=true; btn.textContent='儲存中…';
  try{ await Auth.changePassword(a); toast('密碼已更新'); await route(); }
  catch(e){ msg.innerHTML=`<div class="fb b" style="margin-top:12px">❌ ${esc(e.message)}</div>`; btn.disabled=false; btn.textContent='儲存並進入'; }
}

/* =====================================================================
   管理員登入前台 → 導向後台
   ===================================================================== */
function renderAdminLanding(){
  const u=me();
  root().innerHTML=`<div class="shell"><div class="auth">
    <div class="auth-logo"><div class="mk">✚</div><div class="nm">照護<b>學堂</b></div>
      <div class="tag2">管理員 · ${esc(u.name)}</div></div>
    <div class="card">
      <div class="card-h">🛠️ 管理員登入</div>
      <div class="note" style="margin:0 0 14px">你是管理員帳號。請選擇要前往的頁面：</div>
      <a class="btn block" href="admin.html">📋 題庫管理後台</a>
      <a class="btn sec block" style="margin-top:10px" href="report.html">📊 主管報表</a>
      <button class="btn ghost block" style="margin-top:10px" onclick="Auth.logout().then(()=>renderLogin())">登出</button>
    </div>
  </div></div>`;
}

/* =====================================================================
   員工介面殼
   ===================================================================== */
function render(){
  const u=me();
  // 外籍員工：登入後先選「語言學習／技術學習」才進入
  if(u && isForeignRole(u.role) && !S.mode){ renderForeignChooser(); return; }
  // 語言學習（學中文）→ 走單字卡學習流程
  if(u && isForeignRole(u.role) && S.mode==='language'){ S.vspeak? renderVocabSpeak() : (S.vprac? renderVocabPractice() : (S.vunit? renderVocabStudy() : renderVocabUnits())); return; }
  ({home:renderHome, learn:renderLearn, quizzes:renderQuizList,
    review:renderReview, leaderboard:renderLeaderboard }[S.view]||renderHome)();
}
/* 目前登入者可見的測驗（外籍依語言＋所選模式過濾） */
function visibleQuizzes(){
  const u=me(); if(!u) return [];
  if(u.role==='admin') return DB.quizzes();
  if(isForeignRole(u.role)) return DB.foreignQuizzes(u.lang||'vi', S.mode||undefined);
  return DB.quizzesFor(u.role);
}
/* 外籍：語言學習／技術學習 二選一 */
function renderForeignChooser(){
  const u=me(), l=langOf(u.lang);
  root().innerHTML=`<div class="shell"><div class="content" style="padding-top:36px">
    <div class="greet">嗨，${esc(u.name)} 👋<span class="sub">${l.flag} ${l.name} · 請選擇今天要學什麼</span></div>
    <div class="card" style="margin-top:16px"><button class="btn block" style="padding:18px;font-size:17px" onclick="setMode('skill')">📘 技術學習（照護知識）</button></div>
    <div class="card"><button class="btn sec block" style="padding:18px;font-size:17px" onclick="setMode('language')">🈶 語言學習（學中文）</button></div>
    <div class="note center" style="margin-top:16px"><button class="btn ghost" onclick="Auth.logout().then(()=>renderLogin())">⏻ 登出</button></div>
  </div></div>`;
}
async function setMode(m){
  S.mode=m; S.view='home'; S.vunit=null; window.scrollTo(0,0);
  if(m==='language'){ try{ await DB.loadVocab(me().lang); await DB.loadVocabProgress(); }catch(e){ toast('載入失敗：'+e.message); } }
  render();
}

/* =====================================================================
   學中文：單字卡學習（依主題＋級別分小單元）
   ===================================================================== */
function jsq(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'').replace(/\n/g,' '); }
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('此裝置不支援朗讀'); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text)); u.lang='zh-TW'; u.rate=0.9; speechSynthesis.speak(u);
  }catch(e){}
}
function vocabShell(inner){
  return `<div class="shell">
    <div class="topbar">
      <div class="brand"><span class="mark">✚</span>照護<b>學堂</b></div>
      <div class="grow"></div>
      <button class="btn sec sm" onclick="switchMode()">🔄 切換</button>
      <button class="iconbtn" title="登出" onclick="Auth.logout().then(()=>renderLogin())">⏻</button>
    </div>
    <div class="content">${inner}</div>
  </div>`;
}
function switchMode(){ S.mode=null; S.vunit=null; render(); }
function vocabUnitsData(){
  const units={};
  DB.vocab().forEach(c=>{ const th=c.theme||'其他', lv=c.level||'basic', k=th+'|'+lv;
    (units[k]=units[k]||{theme:th,level:lv,list:[]}).list.push(c); });
  return Object.values(units).sort((a,b)=> a.theme.localeCompare(b.theme) || (a.level>b.level?1:-1));
}
function renderVocabUnits(){
  const u=me(), l=langOf(u.lang), units=vocabUnitsData();
  root().innerHTML=vocabShell(`
    <div class="greet">🈶 學中文 <span class="sub">${l.flag} ${l.name} · 嗨，${esc(u.name)}</span></div>
    ${units.length? `<div class="sect">選一個單元開始</div><div class="card">
      ${units.map(un=>{ const fam=un.list.filter(c=>DB.isFamiliar(c.id)).length;
        return `<div class="row-item">
          <div class="thumb">${un.level==='advanced'?'🌶️':'🌱'}</div>
          <div class="row-body"><div class="t">${esc(un.theme)} <span class="tag ${un.level==='advanced'?'amber':'teal'}">${un.level==='advanced'?'進階':'基礎'}</span></div>
            <div class="s">${un.list.length} 張 · 已熟悉 ${fam}/${un.list.length}</div></div>
          <div class="rowbtns" style="flex-wrap:wrap;justify-content:flex-end">
            <button class="btn sec sm" onclick="openVocabUnit('${jsq(un.theme)}','${un.level}')">字卡</button>
            <button class="btn sec sm" onclick="startVocabPractice('${jsq(un.theme)}','${un.level}')">練習</button>
            <button class="btn sm" onclick="startVocabSpeak('${jsq(un.theme)}','${un.level}')">🎤 口說</button>
          </div>
        </div>`; }).join('')}
    </div>` : '<div class="card"><div class="empty"><span class="e">📭</span>老師還沒建立單字卡，請稍後再來。</div></div>'}`);
}
function openVocabUnit(theme, level){ S.vunit={theme,level}; S.vidx=0; S.vflip=false; window.scrollTo(0,0); render(); }
function vocabUnitCards(){ const {theme,level}=S.vunit; return DB.vocab().filter(c=>(c.theme||'其他')===theme && (c.level||'basic')===level); }
function renderVocabStudy(){
  const cards=vocabUnitCards();
  if(!cards.length){ S.vunit=null; render(); return; }
  const i=Math.min(S.vidx, cards.length-1), c=cards[i], fam=DB.isFamiliar(c.id);
  const exBlock=(icon,role,zh,py,nat)=> zh? `<div class="fb g" style="text-align:left;margin-top:10px">
      <div><b>${icon} ${role}：</b>${esc(zh)} <button class="btn ghost sm" onclick="event.stopPropagation();speak('${jsq(zh)}')">🔊</button></div>
      <div class="muted" style="font-size:13px;margin-top:2px">${esc(py||'')}${nat?'　'+esc(nat):''}</div></div>`:'';
  root().innerHTML=vocabShell(`
    <div class="qhead"><span><button class="btn ghost sm" onclick="S.vunit=null;render()">← 單元</button>　${esc(S.vunit.theme)}·${S.vunit.level==='advanced'?'進階':'基礎'}</span><span>${i+1} / ${cards.length}</span></div>
    <div class="bar"><i style="width:${(i+1)/cards.length*100}%"></i></div>
    <div class="card" style="text-align:center;padding:28px 20px;cursor:pointer" onclick="S.vflip=!S.vflip;render()">
      <div style="font-size:36px;font-weight:900;letter-spacing:1px">${esc(c.zh)}</div>
      <div class="muted" style="font-size:18px;margin-top:6px">${esc(c.pinyin||'')}</div>
      <button class="btn sec sm" style="margin-top:12px" onclick="event.stopPropagation();speak('${jsq(c.zh)}')">🔊 播放</button>
      ${S.vflip? `<div class="divider"></div>
        <div style="font-size:18px;font-weight:800;color:var(--brand-dk)">${esc(c.meaning||'')}</div>
        ${exBlock('👴','長輩',c.example_zh,c.example_pinyin,c.example_native)}
        ${exBlock('🧑‍⚕️','照顧員',c.example_staff_zh,c.example_staff_pinyin,c.example_staff_native)}`
        : '<div class="note" style="margin-top:14px">👆 點卡片翻面看意思與對話例句</div>'}
    </div>
    <div class="inline" style="margin-top:14px">
      <button class="toggle-btn ${fam?'':'on-unfam'}" onclick="markVocab('${c.id}',false)">${fam?'':'✓ '}🤔 不熟</button>
      <button class="toggle-btn ${fam?'on-fam':''}" onclick="markVocab('${c.id}',true)">${fam?'✓ ':''}✅ 熟悉</button>
    </div>
    <div class="inline" style="margin-top:10px">
      <button class="btn sec" style="flex:1" onclick="vocabPrev()" ${i?'':'disabled'}>上一張</button>
      <button class="btn" style="flex:2" onclick="vocabNext()">${i===cards.length-1?'完成單元':'下一張'} →</button>
    </div>`);
}
function vocabPrev(){ if(S.vidx>0){ S.vidx--; S.vflip=false; render(); } }
function vocabNext(){ const n=vocabUnitCards().length; if(S.vidx<n-1){ S.vidx++; S.vflip=false; render(); } else { S.vunit=null; render(); toast('單元完成！🎉'); } }
async function markVocab(id, familiar){ try{ await DB.setVocabFamiliar(id, familiar); render(); }catch(e){ toast('儲存失敗：'+e.message); } }

/* ---------- 學中文練習（由單字卡自動生成：看/情境/聽） ---------- */
function startVocabPractice(theme, level){
  const pool=DB.vocab().filter(c=>(c.theme||'其他')===theme && (c.level||'basic')===level);
  if(!pool.length){ toast('此單元沒有卡'); return; }
  const distr = DB.vocab().length>=4 ? DB.vocab() : pool;
  const types=['meaning','produce','listen'];
  const list=shuffle(pool).map(card=>{
    const type=types[Math.floor(Math.random()*types.length)];
    const others=shuffle(distr.filter(c=>c.id!==card.id)).slice(0,3);
    const opts=shuffle([card,...others]).map(c=>({ text: type==='produce'? c.zh : (c.meaning||c.zh), correct:c.id===card.id }));
    return { card, type, options:opts, theme, level };
  });
  S.vprac={ list, idx:0, correct:0, answered:false };
  window.scrollTo(0,0); render();
}
function renderVocabPractice(){
  const P=S.vprac, q=P.list[P.idx], keys=['A','B','C','D'];
  const prompt = q.type==='produce'
    ? `<div class="muted" style="font-size:12px;margin-top:6px">選出正確的中文說法</div><div class="stem">${esc(q.card.meaning||'')}</div>`
    : q.type==='listen'
      ? `<div class="muted" style="font-size:12px;margin-top:6px">🎧 聽中文，選出意思</div><div style="text-align:center;margin:16px 0"><button class="btn" onclick="speak('${jsq(q.card.zh)}')">🔊 再播一次</button></div>`
      : `<div class="muted" style="font-size:12px;margin-top:6px">這個中文是什麼意思？</div><div class="stem">${esc(q.card.zh)} <span class="muted" style="font-size:16px">${esc(q.card.pinyin||'')}</span></div>`;

/* ---------- 學中文 · 口說跟讀（瀏覽器內 Whisper，免金鑰） ---------- */
let _rec=null, _recChunks=[], _asr=null, _tf=null;
async function tfLib(){ if(!_tf){ _tf=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'); _tf.env.allowLocalModels=false; } return _tf; }
async function getASR(){ if(_asr) return _asr; const { pipeline }=await tfLib(); _asr=await pipeline('automatic-speech-recognition','Xenova/whisper-base'); return _asr; }
/* 把錄音 blob 解碼成 16kHz 單聲道 Float32（不依賴內建 read_audio，較穩） */
async function blobToPCM16k(blob){
  const arr=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();
  const decoded=await ctx.decodeAudioData(arr.slice(0));
  try{ ctx.close(); }catch(_){}
  const off=new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration*16000)), 16000);
  const mono=off.createBuffer(1, decoded.length, decoded.sampleRate);
  const tmp=new Float32Array(decoded.length);
  for(let ch=0;ch<decoded.numberOfChannels;ch++){ const d=decoded.getChannelData(ch); for(let i=0;i<d.length;i++) tmp[i]+=d[i]/decoded.numberOfChannels; }
  mono.copyToChannel(tmp,0);
  const src=off.createBufferSource(); src.buffer=mono; src.connect(off.destination); src.start(0);
  const rendered=await off.startRendering();
  return rendered.getChannelData(0);
}
function rmsOf(f32){ if(!f32||!f32.length) return 0; let s=0; for(let i=0;i<f32.length;i++) s+=f32[i]*f32[i]; return Math.sqrt(s/f32.length); }
function zhOnly(s){ return String(s||'').replace(/[^一-鿿]/g,''); }
function pronScore(target, heard){
  const t=zhOnly(target), h=zhOnly(heard);
  if(!h) return { ok:false, level:'none' };
  if(h===t) return { ok:true, level:'perfect' };
  if(h.includes(t)||t.includes(h)) return { ok:true, level:'close' };
  const set=new Set(t.split('')); let hit=0; for(const ch of h) if(set.has(ch)) hit++;
  return (hit/Math.max(t.length,1))>=0.5 ? { ok:true, level:'close' } : { ok:false, level:'off' };
}
function startVocabSpeak(theme, level){
  const pool=DB.vocab().filter(c=>(c.theme||'其他')===theme && (c.level||'basic')===level);
  if(!pool.length){ toast('此單元沒有卡'); return; }
  S.vspeak={ list:pool, idx:0, theme, level, phase:'idle', heard:'', result:null, myAudioUrl:null };
  window.scrollTo(0,0); render();
}
function renderVocabSpeak(){
  const V=S.vspeak, c=V.list[V.idx];
  const btn = V.phase==='recording'
    ? `<button class="btn block" style="background:var(--bad);box-shadow:none" onclick="speakStop()">⏹️ 停止並評測</button>`
    : V.phase==='working'
      ? `<button class="btn block" disabled>⏳ 辨識中…（首次會下載語音模型）</button>`
      : `<button class="btn block" onclick="speakStart()">🎤 開始錄音</button>`;
  root().innerHTML=vocabShell(`
    <div class="qhead"><span><button class="btn ghost sm" onclick="S.vspeak=null;render()">← 結束</button>　🎤 口說跟讀</span><span>${V.idx+1} / ${V.list.length}</span></div>
    <div class="bar"><i style="width:${(V.idx+1)/V.list.length*100}%"></i></div>
    <div class="card" style="text-align:center;padding:26px 20px">
      <div style="font-size:34px;font-weight:900">${esc(c.zh)}</div>
      <div class="muted" style="font-size:18px;margin-top:6px">${esc(c.pinyin||'')}</div>
      <button class="btn sec sm" style="margin-top:12px" onclick="speak('${jsq(c.zh)}')">🔊 先聽正確發音</button>
      <div style="margin-top:16px">${btn}</div>
      ${V.myAudioUrl? `<div class="inline" style="margin-top:12px;justify-content:center;gap:8px">
        <button class="btn sec sm" onclick="speak('${jsq(c.zh)}')">🔊 正確發音</button>
        <button class="btn sec sm" onclick="playMyRec()">▶️ 我的錄音</button>
      </div><div class="note center" style="margin-top:6px">兩個都按，比比看你唸的和正確發音差在哪</div>`:''}
      ${V.result? speakFeedback(V) : '<div class="note" style="margin-top:12px">先按 🔊 聽發音，再按「開始錄音」唸出上面的中文，然後按停止，系統會判斷你唸得標不標準。</div>'}
    </div>
    <div class="inline" style="margin-top:12px">
      <button class="btn sec" style="flex:1" onclick="speakNav(-1)" ${V.idx?'':'disabled'}>上一個</button>

    </div>`);
}
function speakFeedback(V){
  const r=V.result;
  const head = r.level==='perfect'?'✅ 發音很標準！' : r.level==='close'?'🔶 很接近，再清楚一點就更好' : (r.level==='none'?'🎙️ 沒聽清楚，再試一次':'❌ 再試一次');
  return `<div class="fb ${r.ok?'g':'b'}" style="text-align:left;margin-top:14px">
    <div class="h">${head}</div>
    ${V.heard? '我聽到你唸：<b>'+esc(V.heard)+'</b>' : ''}
  </div>`;
}
function speakNav(d){
  const V=S.vspeak, n=V.idx+d;
  if(n<0) return;
  if(V.myAudioUrl){ try{ URL.revokeObjectURL(V.myAudioUrl); }catch(_){} V.myAudioUrl=null; }
  if(n>=V.list.length){ S.vspeak=null; render(); toast('口說練習完成！🎉'); return; }
  V.idx=n; V.result=null; V.heard=''; V.phase='idle'; render();
}
function playMyRec(){ const u=S.vspeak&&S.vspeak.myAudioUrl; if(!u){ toast('還沒有錄音'); return; } try{ new Audio(u).play(); }catch(e){} }
async function speakStart(){
  const V=S.vspeak;
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('此裝置／瀏覽器不支援錄音'); return; }
  try{
    if(V.myAudioUrl){ try{ URL.revokeObjectURL(V.myAudioUrl); }catch(_){} V.myAudioUrl=null; }
    const stream=await navigator.mediaDevices.getUserMedia({ audio:true });
    _recChunks=[]; _rec=new MediaRecorder(stream);
    _rec.ondataavailable=e=>{ if(e.data && e.data.size) _recChunks.push(e.data); };
    _rec.start(); V.phase='recording'; V.result=null; V.heard=''; render();
  }catch(e){ toast('無法取得麥克風權限，請允許後再試'); }
}
function _stopRec(){ return new Promise(res=>{ _rec.onstop=()=>{ const blob=new Blob(_recChunks,{type:_rec.mimeType||'audio/webm'}); try{ _rec.stream.getTracks().forEach(t=>t.stop()); }catch(_){} res(blob); }; _rec.stop(); }); }
async function speakStop(){
  const V=S.vspeak;
  try{
    const blob=await _stopRec();
    if(V.myAudioUrl){ try{ URL.revokeObjectURL(V.myAudioUrl); }catch(_){} }
    V.myAudioUrl=URL.createObjectURL(blob);
    V.phase='working'; render();
    const audio=await blobToPCM16k(blob);
    // 沒收到聲音（太短或幾乎無聲）→ 提示，不硬送給模型（避免亂猜「好」）
    if(!audio || audio.length < 16000*0.3 || rmsOf(audio) < 0.006){
      V.phase='idle'; V.heard=''; V.result={ ok:false, level:'none' }; render();
      toast('沒收到清楚的聲音，請靠近麥克風、大聲一點再唸一次'); return;
    }
    if(!_asr) toast('首次載入語音模型（較準的 base 版），請稍候…');
    const asr=await getASR();
    const out=await asr(audio, { language:'chinese', task:'transcribe' });
    const heard=((out&&out.text)||'').trim();
    V.heard=heard; V.result=pronScore(V.list[V.idx].zh, heard); V.phase='idle'; render();
  }catch(e){ V.phase='idle'; render(); toast('辨識失敗：'+String(e&&e.message||e).slice(0,90)); }
}

async function openFlash(quizId){
  try{
    const cards=await DB.ensureFlash(quizId);
    if(!cards.length){ toast('這份測驗還沒有題目'); return; }
    await DB.loadCardReviews(cards.map(c=>c.id));
    const today=todayNum();
    let due=cards.filter(c=>{ const r=DB.cardReview(c.id); return !r || r.due<=today; });
    const reviewingAll=!due.length;
    if(reviewingAll) due=cards;                       // 沒有到期的卡就全部複習一輪
    S.flash={ quizId, queue:shuffle(due), pos:0, reveal:false, known:0, total:due.length, reviewingAll };
    S.view='learn'; renderFlashCard();
  }catch(e){ toast('載入失敗：'+e.message); }
}

async function rateFlash(known){
  const F=S.flash, c=F.queue[F.pos];
  try{ await DB.rateCard(c.id, known); }catch(e){ toast('儲存失敗：'+e.message); }
  if(known) F.known++;
  else F.queue.push(c);                 // 需複習：本輪稍後再出現一次
  F.pos++; F.reveal=false;
  renderFlashCard();
}
function renderFlashDone(){
  const F=S.flash;
  root().innerHTML=shell(`
    <div class="card center" style="padding:34px 22px">
      <div class="big-emoji">🎉</div>
      <h3 style="font-size:20px;font-weight:900;margin:12px 0 4px">這輪字卡複習完成！</h3>
      <div class="note center">按「熟悉」的卡會隔更久才再出現（熟悉 2–3 次後就很少出現）；按「需複習」的卡會較快再遇到。每個帳號分開記錄。</div>
      <div class="inline" style="margin-top:20px">
        <button class="btn sec" style="flex:1" onclick="openFlash('${F.quizId}')">再複習一輪</button>
        <button class="btn" style="flex:1" onclick="go('learn')">回學習</button>
      </div>
    </div>
  `,'learn');
}

/* =====================================================================
   測驗列表
   ===================================================================== */
function renderQuizList(){
  const u=me(), quizzes=visibleQuizzes();
  root().innerHTML=shell(`
    <div class="sect">📝 全部測驗</div>
    <div class="admin-hint">💡 測驗會即時評分並記錄成績；作答時看不到正解，答完才會顯示對錯與重點提示。</div>
    <div class="card">${quizzes.length? quizzes.map(q=>quizRow(q,false)).join('') : '<div class="empty"><span class="e">📭</span>目前沒有開放的測驗</div>'}</div>
    <div class="note center" style="margin-top:14px">只顯示開放給你角色（${roleName(u.role)}）的測驗</div>
  `,'quizzes');
}

/* =====================================================================
   作答（伺服器評分）
   ===================================================================== */
async function startQuiz(quizId){
  try{
    const qs=await DB.ensureQuizQuestions(quizId);
    if(!qs.length){ toast('這份測驗還沒有題目'); return; }
    S.play={ quizId, sessionId:newSessionId(), title:(DB.quiz(quizId)||{}).title||'測驗',
      list:shuffle(qs), idx:0, answered:false, correctCount:0, pointsEarned:0, pending:[] };
    S.view='quizzes'; renderPlay();
  }catch(e){ toast('載入失敗：'+e.message); }
}
function renderPlay(){
  const P=S.play, cur=P.list[P.idx], keys=['A','B','C','D','E','F'];
  root().innerHTML=shell(`
    <div class="qhead"><span>${esc(P.title)}</span><span>${P.idx+1} / ${P.list.length}</span></div>
    <div class="bar"><i style="width:${P.idx/P.list.length*100}%"></i></div>
    <div class="stem">${esc(cur.stem)}</div>
    <div id="opts">
      ${(cur.options||[]).map((o,i)=>`<button class="opt" onclick="answerQuiz(this,${JSON.stringify(o).replace(/"/g,'&quot;')})"><span class="key">${keys[i]||'?'}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
  `,'quizzes');
}
function answerQuiz(btn, chosen){
  const P=S.play; if(P.answered) return; P.answered=true;
  const cur=P.list[P.idx], u=me();
  const correct = String(chosen) === String(cur.correct);         // 本機立即判斷
  const bonus = correct ? Math.min(u.streak||0, 5) : 0;           // 連續天數獎勵（上限 5）
  const gained = correct ? (10 + bonus) : 0;
  document.querySelectorAll('#opts .opt').forEach(b=>{ b.disabled=true;
    const txt=b.querySelector('span:last-child').textContent;
    if(txt===cur.correct) b.classList.add('correct');
    else if(txt===chosen) b.classList.add('wrong'); });
  if(correct){ P.correctCount++; P.pointsEarned+=gained; u.points+=gained; u.answered+=1; }
  document.getElementById('fb').innerHTML=`
    <div class="fb ${correct?'g':'b'}">
      <div class="h">${correct?`✅ 答對了！ +10${bonus>0?`+${bonus}`:''} 分${bonus>0?'<span style="font-weight:600;font-size:13px;color:var(--muted)">（基本 10＋連續獎勵 '+bonus+'）</span>':''}`:'❌ 答錯了'}</div>
      ${correct?'':`正確答案：<b>${esc(cur.correct)}</b><br>`}${cur.quiz_note?'💡 '+esc(cur.quiz_note):''}
    </div>
    <button class="btn block" style="margin-top:14px" onclick="nextQ()">${P.idx===P.list.length-1?'看成績':'下一題'} →</button>`;
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  // 背景送伺服器權威記錄（不阻塞畫面；成績仍以伺服器為準）
  (P.pending=P.pending||[]).push(DB.grade(P.sessionId, P.quizId, cur.id, chosen).catch(()=>{}));
}
function nextQ(){ const P=S.play; if(P.idx<P.list.length-1){ P.idx++; P.answered=false; renderPlay(); } else finishQuiz(); }
async function finishQuiz(){
  const P=S.play;
  await Promise.allSettled(P.pending||[]);        // 確保背景作答都已送出記錄
  try{ await DB.refreshReviews(); }catch(_){}      // 讓答錯的題目立即出現在複習清單/首頁待複習
  if(P.isReview){ toast(`複習完成！+${P.pointsEarned} 分`); go('home'); return; }
  try{ await DB.finish(P.sessionId, P.quizId); }catch(e){ /* 成績已於作答時逐題記錄，仍顯示結果 */ }
  renderResult();
}
function renderResult(){
  const P=S.play, pct=Math.round(P.correctCount/P.list.length*100);
  const emoji=pct===100?'🏆':pct>=60?'😄':'💪';
  const line=pct===100?'完美！全部答對':pct>=60?'表現不錯，繼續加油':'再複習一下會更好';
  root().innerHTML=shell(`
    <div class="card center" style="padding:34px 22px">
      <div class="big-emoji">${emoji}</div>
      <h3 style="font-size:22px;font-weight:900;margin:12px 0 2px">${line}</h3>
      <div class="muted" style="font-size:13px">${esc(P.title)}</div>
      <div class="stats" style="margin-top:22px">
        <div class="tile"><div class="num">${P.correctCount}/${P.list.length}</div><div class="lbl">答對題數</div></div>
        <div class="tile"><div class="num">${pct}%</div><div class="lbl">正確率</div></div>
        <div class="tile"><div class="num" style="color:var(--brand)">+${P.pointsEarned}</div><div class="lbl">獲得積分</div></div>
      </div>
      <div class="inline" style="margin-top:22px">
        <button class="btn sec" style="flex:1" onclick="startQuiz('${P.quizId}')">再測一次</button>
        <button class="btn" style="flex:1" onclick="go('home')">回首頁</button>
      </div>
    </div>
  `,'quizzes');
}

/* =====================================================================
   複習（SRS）—— 也走伺服器評分
   ===================================================================== */
async function renderReview(){
  root().innerHTML=shell('<div class="note center" style="padding:40px">載入複習…</div>','review');
  try{ await DB.refreshReviews(); }catch(_){}
  const t=todayNum(), due=DB.dueReviews(t);
  if(!due.length){
    root().innerHTML=shell(`<div class="card center" style="padding:40px 22px">
      <div class="big-emoji">🎉</div>
      <h3 style="font-size:20px;font-weight:900;margin:12px 0 4px">今天沒有待複習</h3>
      <div class="note center">完成測驗後，題目會依「間隔複習法」自動排入複習清單。</div>
      <button class="btn" style="margin-top:18px" onclick="go('quizzes')">去做測驗</button>
    </div>`,'review'); return;
  }
  root().innerHTML=shell('<div class="note center" style="padding:40px">載入複習題目…</div>','review');
  try{
    const qs=await DB.questionsByIds(due.map(r=>r.question_id));
    if(!qs.length){ root().innerHTML=shell('<div class="empty">複習題目已不存在</div>','review'); return; }
    S.play={ quizId:'__review__', sessionId:newSessionId(), title:'🔁 今日複習',
      list:qs, idx:0, answered:false, correctCount:0, pointsEarned:0, isReview:true, pending:[] };
    renderPlay();
  }catch(e){ root().innerHTML=shell(`<div class="empty">載入失敗：${esc(e.message)}</div>`,'review'); }
}

/* =====================================================================
   排行榜
   ===================================================================== */
function renderLeaderboard(){
  const u=me();
  const rows=DB.leaderboard().slice().sort((a,b)=>b.points-a.points);
  root().innerHTML=shell(`
    <div class="sect">🏆 積分排行榜</div>
    <div class="card">
      ${rows.map((x,i)=>{ const r=roleOf(x.role); const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
        return `<div class="lb ${x.id===u.id?'mine':''}">
          <div class="rk ${i<3?'top':''}">${medal}</div>
          <span class="avatar" style="background:${r.color}">${esc(initials(x.name))}</span>
          <div class="row-body"><div class="t">${esc(x.name)} ${x.id===u.id?'<span class="tag teal">你</span>':''}</div>
            <div class="s">${roleName(x.role)} · 🔥${x.streak}天 · ✅${x.answered}題</div></div>
          <div class="pts">${x.points}<span>分</span></div>
        </div>`; }).join('') || '<div class="empty">尚無資料</div>'}
    </div>
  `,'leaderboard');
}

/* ---------- 啟動 ---------- */
boot();
</script>
